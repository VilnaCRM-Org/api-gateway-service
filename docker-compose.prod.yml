# Run with an explicit env file so that the committed development .env is not read:
#   docker compose --env-file /etc/service/prod.env -f docker-compose.yml -f docker-compose.prod.yml up --detach --wait
services:
  app:
    depends_on: !override
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: prod
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      AWS_REGION: ${AWS_REGION:?AWS_REGION is required}
      AWS_ENDPOINT_URL_SQS: !reset null # real SQS through the default credential chain
      AWS_ACCESS_KEY_ID: !reset null
      AWS_SECRET_ACCESS_KEY: !reset null
      # The production cluster: SASL SCRAM over TLS and the enforced gates. KAFKA_CA_FILE needs a file mounted
      # into the container, which a deployment adds.
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?KAFKA_BOOTSTRAP_SERVERS is required}
      KAFKA_SECURITY_PROTOCOL: SASL_SSL
      KAFKA_CONFIG_GATES: enforce
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:?KAFKA_SASL_USERNAME is required}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:?KAFKA_SASL_PASSWORD is required}
    volumes: !override
      - ${JWT_PUBLIC_KEYS_HOST_FILE:?JWT_PUBLIC_KEYS_HOST_FILE is required}:/etc/service/jwt-public-keys.pem:ro
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
          pids: 256
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  iam-gateway:
    environment:
      APP_ENV: prod
      # The pair is mounted from a directory of the host; the gateway reloads it when the files change.
      GATEWAY_TLS_CERT_FILE: ${GATEWAY_TLS_CERT_FILE:-/etc/service/tls/tls.crt}
      GATEWAY_TLS_KEY_FILE: ${GATEWAY_TLS_KEY_FILE:-/etc/service/tls/tls.key}
    volumes: !override
      - ${JWT_PUBLIC_KEYS_HOST_FILE:?JWT_PUBLIC_KEYS_HOST_FILE is required}:/etc/service/jwt-public-keys.pem:ro
      - ${UPSTREAM_ENDPOINTS_HOST_FILE:?UPSTREAM_ENDPOINTS_HOST_FILE is required}:/etc/service/upstream-endpoints.json:ro
      - ${GATEWAY_TLS_HOST_DIR:?GATEWAY_TLS_HOST_DIR is required}:/etc/service/tls:ro
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 256M
          pids: 256
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  migrate:
    depends_on: !reset null
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  database:
    profiles: [local]

  localstack:
    profiles: [local]

  kafka:
    profiles: [local]

  kafka-tls:
    profiles: [local]

  kafka-topics:
    profiles: [local]

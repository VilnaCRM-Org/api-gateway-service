                $ref: '#/components/schemas/Problem'
      security:
      - bearerAuth: []
    put:
      tags:
      - iam
      summary: Replaces the route configuration of a host.
      description: 'Replaces the full route set of the host atomically when `If-Match` holds the `ETag` that the retrieval returned: routes of the set that the host lacks are created, routes whose methods and path pattern match a stored route are updated, and stored routes that the set omits are deleted, all in one transaction under one policy version, with their `route/<id>` state records, `iam.route.*` events, `iam.route_configuration.applied` and an audit record. The whole set is validated first: one violation, conflict or route the caller may not write rejects it, and the candidate route table of the host must build. A set holds at most `ROUTE_CONFIGURATION_MAX_ROUTES` routes (1,000 by default); a larger set is refused with 422. With `dryRun=true` the operation runs every check and returns the diff without writing anything. A set whose diff deletes a route, clears `anonymous` or moves `enforcement` from `audit` to `enforce` is revocation-class. The caller needs `iam:route:{service}` or `iam:route:*` for every service the set touches, and `iam:route:anonymous` to create an anonymous or audit-only route or change either flag. A repeated request fails with 412 once the set changed, which makes it safe to repeat.'
      operationId: api_route_configurations_host_put
      parameters:
      - name: host
        in: path
        description: The lower-case DNS name of the host
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        description: The `ETag` of the set the replacement changes, as the retrieval returned it.
        required: true
        schema:
          type: string
      - name: Prefer
        in: header
        description: 'What the write waits for: `wait=published` (the default) returns once Kafka acknowledged the policy version, `wait=propagated` is refused with 422 until the gateway pods report their versions.'
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: dryRun
        in: query
        description: Returns the diff and writes nothing; `false` when absent.
        required: false
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyRouteConfigurationRequest'
        required: true
      responses:
        '200':
          description: The diff of the set; the set was applied unless `dryRun` is true.
          headers:
            etag:
              schema:
                type: string
              description: The version of the set in double quotes.
            iam-policy-offset:
              schema:
                type: string
              description: The offset at which Kafka stored the `__head` record of the policy version; present when the change was acknowledged.
            iam-policy-version:
              schema:
                type: string
              description: The policy version that the change produced; absent for a dry run and for a set that changes nothing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteConfigurationDiff'
        '202':
          description: The change is committed and its policy version was not acknowledged by Kafka within `PUBLISH_WAIT_TIMEOUT`; it may not be in force on the gateway yet.
          headers:
            etag:
              schema:
                type: string
              description: The version of the set in double quotes.
            iam-policy-version:
              schema:
                type: string
              description: The policy version that the change produced.
            iam-propagation-status:
              schema:
                type: string
              description: '`committed_pending_propagation`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteConfigurationDiff'
        '400':
          description: Invalid input.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The caller presented no valid bearer token.
          headers:
            www-authenticate:
              schema:
                type: string
              description: The `Bearer` challenge.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller lacks the operation key, the route key of a service or `iam:route:anonymous`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The set holds conflicting routes or a route table that the gateway could not build, or it changes a route that IAM manages itself.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          description: '`If-Match` is not the current version of the set.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: Request body too large.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Unsupported media type.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation failed, or the set holds more than `ROUTE_CONFIGURATION_MAX_ROUTES` routes.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '428':
          description: '`If-Match` is missing.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearerAuth: []

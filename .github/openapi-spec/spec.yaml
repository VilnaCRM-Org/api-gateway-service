        description: Makes the update safe to repeat for 24 hours; 1 to 255 visible ASCII characters.
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: Prefer
        in: header
        description: 'What the write waits for: `wait=published` (the default) returns once Kafka acknowledged the policy version, `wait=propagated` is refused with 422 until the gateway pods report their versions.'
        required: false
        schema:
          type:
          - string
          - 'null'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUpstreamRequest'
        required: true
      responses:
        '200':
          description: The upstream was updated.
          headers:
            etag:
              schema:
                type: string
              description: The new version of the upstream in double quotes.
            iam-policy-offset:
              schema:
                type: string
              description: The offset at which Kafka stored the `__head` record of the policy version; present when the change was acknowledged.
            iam-policy-version:
              schema:
                type: string
              description: The policy version that the change produced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upstream'
        '202':
          description: The change is committed and its policy version was not acknowledged by Kafka within `PUBLISH_WAIT_TIMEOUT`; it may not be in force on the gateway yet.
          headers:
            etag:
              schema:
                type: string
              description: The new version of the upstream in double quotes.
            iam-policy-version:
              schema:
                type: string
              description: The policy version that the change produced.
            iam-propagation-status:
              schema:
                type: string
              description: '`committed_pending_propagation`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upstream'
        '400':
          description: Invalid input.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The caller presented no valid bearer token.
          headers:
            www-authenticate:
              schema:
                type: string
              description: The `Bearer` challenge.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller lacks the operation key or the route key of the catalogue service.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Upstream not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The upstream is a system upstream or belongs to the `iam` service, or it changed concurrently.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          description: '`If-Match` is not the current version.'

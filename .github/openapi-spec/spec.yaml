  /api/users/{userId}/role-permissions:
    get:
      tags:
      - iam
      summary: Retrieves the effective permissions of a user.
      description: Returns every key and wildcard that the active assignments of the user hold, each with the roles that grant it, its scopes (`all` or the project ids), the shortest expiry among the contributing assignments that expire, and the `policyVersion` the answer was composed at. Assignments that have expired grant nothing, a reserved `iam:` key counts only through a global assignment, and a wildcard never covers a sensitive key, exactly as in a decision. `projectId` keeps the global assignments and those of the project; `service` keeps the keys and wildcards of the service. A user without assignments has an empty list.
      operationId: api_users_user_id_role_permissions_get
      parameters:
      - name: userId
        in: path
        description: User identifier
        required: true
        schema:
          type: string
          format: uuid
      - name: projectId
        in: query
        description: 'Only assignments that apply in this project: the global ones and those of the project.'
        required: false
        schema:
          type: string
          format: uuid
      - name: service
        in: query
        description: Only keys and wildcards of this service.
        required: false
        schema:
          type: string
          maxLength: 63
        example: billing
      responses:
        '200':
          description: The effective permissions of the user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRolePermissions'
        '400':
          description: Invalid identifier or query parameter.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The caller presented no valid bearer token.
          headers:
            www-authenticate:
              schema:
                type: string
              description: The `Bearer` challenge.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller does not hold the key of the operation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearerAuth: []
components:
  schemas:
    AccessScopes:
      oneOf:
      - $ref: '#/components/schemas/AllProjects'
        description: A global assignment holds every required key.
      - type: array
        items:
          type: string
        description: Only these projects hold every required key; empty for a deny.
      description: 'The projects in which an allow holds: `all`, or the project ids.'
    AccessSubject:
      type: object
      description: The subject that a decision was made for.
      required:
      - id
      - kind
      properties:
        id:
          type: string
          description: The user id, or the service name of a service principal.
        kind:
          type: string
          description: '`user` or `service`.'
          example: user
    AccessValidation:
      type: object
      description: The decision body of the access-validation operation.
      required:
      - decision
      - reason
      - denied
      - scopes
      - decisionId
      - requestId
      properties:
        decision:
          type: string
          description: '`allow` or `deny`.'
          example: deny
        decisionId:
          type: string
          format: uuid
          description: The identifier of this decision.
        denied:
          type: array
          items:
            type: string
          description: The keys or coordinates that are denied; empty for an allow.
        policyVersion:
          type:
          - integer
          - 'null'
          format: int64
          description: The policy version that the decision reflects; absent when no policy was read.
          minimum: 0
        reason:
          type: string
          description: |-
            `allowed`, `token_missing`, `token_invalid`, `token_expired`, `token_revoked`,
            `unknown_service`, `unknown_operation`, `malformed_operation`, `permission_missing`,
            `scope_missing`, `limits_exceeded` or `unavailable`.
          example: permission_missing
        requestId:
          type: string
          description: The request id of the caller, as sent.
        scopes:
          $ref: '#/components/schemas/AccessScopes'
          description: 'The projects in which an allow holds: `all` or a list of project ids; empty for a deny.'
        subject:
          oneOf:
          - $ref: '#/components/schemas/AccessSubject'
            description: The subject of the token; absent when no token resolved.
          - type: 'null'
    AccessValidationBatch:
      type: object
      description: The results of the batch access-validation operation.
      required:
      - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/AccessValidation'
          description: One decision per check, in the order of the request; each has its own `decisionId`.
    AccessValidationGraphQlTarget:
      type: object
      description: |-
        The GraphQL document that a check names.

        A document over a limit of the decision API is not refused here: it is decided as a deny with
        `limits_exceeded`.
      required:
      - document
      properties:
        document:
          type: string
          description: |-
            The document as the caller received it; IAM resolves every field it selects against the
            active GraphQL versions of the service.
          example: '{ invoice(id: 42) { id total } }'
        operationName:
          type:
          - string
          - 'null'
          description: The operation to check; optional when the document holds exactly one operation.
          example: GetInvoice
          maxLength: 256
      additionalProperties: false
    AccessValidationRestTarget:
      type: object
      description: The REST request that a check names.
      required:
      - method
      - path
      properties:
        method:
          type: string
          description: |-
            The HTTP method, in upper case: `GET`, `HEAD`, `POST`, `PUT`, `PATCH`, `DELETE` or
            `OPTIONS`.
          example: GET
        path:
          type: string
          description: |-
            The path of the request as received; IAM normalises it and matches it against the
            operation templates of the active `OpenAPI` versions of the service.
          example: /api/invoices/42
      additionalProperties: false
    AllProjects:
      type: string
      description: The marker of a decision that holds in every project.
      enum:
      - all
    ApplyRouteConfigurationRequest:
      type: object
      description: 'Body of the route-configuration operation: the full route set of the host.'
      required:
      - routes
      properties:
        routes:
          type: array
          items:
            $ref: '#/components/schemas/RouteDeclaration'
          description: |-
            The routes the host has afterwards, at most `ROUTE_CONFIGURATION_MAX_ROUTES` (1,000 by
            default); a stored route that the set does not declare is deleted.
      additionalProperties: false
    AssignUserRoleRequest:
      type: object
      description: Body of the assignment operation.
      required:
      - subject
      - roleId
      - scope
      properties:
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
          description: |-
            When the assignment expires, as an RFC 3339 UTC time in the future; absent for an
            assignment that never expires.
          example: 2027-01-15T08:00:00Z
        roleId:
          type: string
          format: uuid
          description: The role to assign; it must exist.
        scope:
          $ref: '#/components/schemas/AssignmentScope'
          description: Where the role applies.
        subject:
          $ref: '#/components/schemas/AssignmentSubject'
          description: Who receives the role.
      additionalProperties: false
    AssignmentScope:
      type: object
      description: 'Where an assignment applies: every project, or one project.'
      required:
      - kind
      properties:
        kind:
          type: string
          description: '`global` for every project, `project` for the project named by `projectId`.'
          example: global
        projectId:
          type:
          - string
          - 'null'
          format: uuid
          description: The project of a project scope; absent for a global scope.
      additionalProperties: false
    AssignmentSubject:
      type: object
      description: 'Who holds an assignment: a user or a service principal.'
      required:
      - kind
      - id
      properties:
        id:
          type: string
          description: The UUID of a user, or the service name of a service principal such as `billing-worker`.
          example: 0190f2a8-7b3c-7d4e-8f10-1234567890ab
          maxLength: 255
          minLength: 1
        kind:
          type: string
          description: '`user` for a user of the User service, `service` for a service principal.'
          example: user
      additionalProperties: false
    BulkOperation:
      type: object
      description: 'A bulk operation: a large change that the runner commits in chunks.'
      required:
      - id
      - kind
      - status
      - totalRecords
      - appliedRecords
      - requester
      - createdAt
      - updatedAt
      properties:
        appliedRecords:
          type: integer
          format: int64
          description: How many records the committed chunks applied.
          minimum: 0
        createdAt:
          type: string
          format: date-time
          description: When the operation was recorded, as an RFC 3339 UTC time.
          example: 2027-01-15T08:00:00.000000Z
        error:
          type:
          - string
          - 'null'
          description: Why the operation failed; absent otherwise.
          maxLength: 500
        firstVersion:
          type:
          - integer
          - 'null'
          format: int64
          description: The policy version of the first committed chunk; absent before the first chunk.
          minimum: 0
        id:
          type: string
          format: uuid
          description: The identifier.
        kind:
          type: string
          description: 'What the operation changes: `role_deletion`, `catalogue`, `resync` or `other`.'
          example: role_deletion
        lastVersion:
          type:
          - integer
          - 'null'
          format: int64
          description: The policy version of the last committed chunk; absent before the first chunk.
          minimum: 0
        propagation:
          oneOf:
          - $ref: '#/components/schemas/BulkOperationPropagation'
            description: |-
              The propagation of a revocation-class bulk operation; `null` until the chunks of such an
              operation are fenced by the pods' acknowledgements.
          - type: 'null'
        requester:
          type: string
          description: Who asked for the change.
          example: user:7f0cdd0e-6c1a-4a3b-9f7e-0b8e8f5f5f01
        status:
          type: string
          description: 'Where it stands: `pending`, `running`, `completed` or `failed`.'
          example: running
        totalRecords:
          type: integer
          format: int64
          description: How many records the whole change touches.
          minimum: 1
        updatedAt:
          type: string
          format: date-time
          description: When the operation last changed, as an RFC 3339 UTC time.
          example: 2027-01-15T08:00:05.000000Z
    BulkOperationPage:
      type: object
      description: One page of bulk operations, oldest first.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BulkOperation'
          description: The operations of the page.
        nextCursor:
          type:
          - string
          - 'null'
          format: uuid
          description: The `after` value of the next page; absent on the last page.
    BulkOperationPropagation:
      type: object
      description: |-
        How far the gateway pods have acknowledged the policy versions of a revocation-class bulk
        operation.
      required:
      - status
      - policyVersion
      - podsAcknowledged
      - podsTimedOut
      properties:
        podsAcknowledged:
          type: integer
          format: int64
          description: How many gateway pods acknowledged the version.
          minimum: 0
        podsTimedOut:
          type: integer
          format: int64
          description: How many gateway pods did not acknowledge it in time.
          minimum: 0
        policyVersion:
          type: integer
          format: int64
          description: The policy version the status is about.
          minimum: 0
        status:
          type: string
          description: '`pending`, `acknowledged` or `timed_out`.'
          example: acknowledged
    CoordinateFlags:
      type: object
      description: The two flags of a coordinate.
      required:
      - sensitive
      - auditAlways
      properties:
        auditAlways:
          type: boolean
          description: Whether every use of the coordinate is audited (`@iamAuditAlways`).
        sensitive:
          type: boolean
          description: Whether a wildcard grant never covers the coordinate (`@iamSensitive`).
    CreateExampleApiResourceRequest:
      type: object
      description: Body of the create operation.
      required:
      - name
      - description
      properties:
        description:
          type: string
          description: Free-text description of the resource.
          example: Example description
          maxLength: 1024
          minLength: 1
          pattern: ^[^\u0000]*$
        name:
          type: string
          description: Display name of the resource.
          example: Example name
          maxLength: 255
          minLength: 1
          pattern: ^[^\u0000]*$
      additionalProperties: false
    CreateGraphQlPermissionsRequest:
      type: object
      description: Body of the operation that activates a GraphQL specification version.
      properties:
        confirmFlagDowngrade:
          type: boolean
          description: |-
            Accepts that keys lose the sensitive or the always-audit flag. Without it, an activation
            that would remove a flag is refused with 409 and lists the keys.
        confirmOrphans:
          type: boolean
          description: |-
            Accepts that grants of keys that leave the catalogue become inactive. Without it, an
            activation that would orphan grants is refused with 409 and lists them.
        renames:
          type: array
          items:
            $ref: '#/components/schemas/KeyRename'
          description: |-
            The coordinates that the version renames; the grants of each old key move to its new key
            before anything is orphaned.
          maxItems: 1000
      additionalProperties: false
    CreateRatePolicyRequest:
      type: object
      description: Body of the rate-policy creation operation.
      required:
      - name
      - key
      - limit
      - periodMs
      - burst
      - fallback
      properties:
        burst:
          type: integer
          format: int64
          description: The number of requests allowed above the limit in a burst, from 0 to 4,294,967,295.
          example: 20
          minimum: 0
        fallback:
          type: string
          description: 'What the limit becomes without the shared counter: `divided` or `full`.'
          example: divided
        key:
          type: string
          description: 'What requests are counted by: `ip`, `subject`, `subject_route` or `route`.'
          example: subject_route
        limit:
          type: integer
          format: int64
          description: The number of requests allowed per period, from 1 to 4,294,967,295.
          example: 100
          minimum: 1
        name:
          type: string
          description: |-
            The name: 1 to 100 characters without a control character, unique among the rate policies
            that are not deleted.
          example: per-subject-route
          maxLength: 100
          minLength: 1
        periodMs:
          type: integer
          format: int64
          description: 'The period in milliseconds: a multiple of 1,000, from 1,000 to 4,294,967,295,000.'
          example: 60000
          minimum: 1000
      additionalProperties: false
    CreateRestPermissionsRequest:
      type: object
      description: Body of the operation that activates an `OpenAPI` specification version.
      properties:
        confirmFlagDowngrade:
          type: boolean
          description: |-
            Accepts that keys lose the sensitive or the always-audit flag. Without it, an activation
            that would remove a flag is refused with 409 and lists the keys.
        confirmOrphans:
          type: boolean
          description: |-
            Accepts that grants of keys that leave the catalogue become inactive. Without it, an
            activation that would orphan grants is refused with 409 and lists them.
        renames:
          type: array
          items:
            $ref: '#/components/schemas/KeyRename'
          description: |-
            The operations that the version renames; the grants of each old key move to its new key
            before anything is orphaned.
          maxItems: 1000
      additionalProperties: false
    CreateRoleRequest:
      type: object
      description: Body of the role-creation operation.
      required:
      - name
      properties:
        description:
          type:
          - string
          - 'null'
          description: What the role is for.
          example: Manages invoices and refunds.
          maxLength: 1000
        name:
          type: string
          description: |-
            The name of the role: unique without regard to case among the roles that are not deleted,
            without control characters.
          example: Billing administrator
          maxLength: 100
          minLength: 1
      additionalProperties: false
    CreateRouteRequest:
      type: object
      description: Body of the route-creation operation.
      required:
      - host
      - methods
      - pathPattern
      - service
      - upstreamId
      properties:
        anonymous:
          type:
          - boolean
          - 'null'
          description: |-
            Whether the route is served without authentication; needs `iam:route:anonymous`; `false`
            when absent.
          default: false
        bodyLimitBytes:
          type: integer
          format: int64
          description: The largest request body, in bytes.
          default: 1048576
          minimum: 1
        cors:
          oneOf:
          - $ref: '#/components/schemas/RouteCorsPolicy'
            description: The CORS policy of the route, when it has one.
          - type: 'null'
        enforcement:
          $ref: '#/components/schemas/RouteEnforcement'
          description: The enforcement mode; `audit` needs `iam:route:anonymous`.
        graphql:
          type:
          - boolean
          - 'null'
          description: Whether the route serves GraphQL; `false` when absent.
          default: false
        host:
          type: string
          description: The lower-case DNS name of the host the route serves.
          example: app.example.test
          maxLength: 253
          minLength: 1
        idleTimeoutMs:
          type: integer
          format: int64
          description: The idle timeout, in milliseconds.
          default: 60000
          minimum: 1
        methods:
          type: array
          items:
            $ref: '#/components/schemas/RouteMethod'
          description: The methods the route serves.
          minItems: 1
        pathPattern:
          type: string
          description: The path pattern, with `{name}` and `{name:*}` segments.
          example: /api/orders/{id}
          maxLength: 2048
          minLength: 1
        ratePolicyIds:
          type: array
          items:
            type: string
          description: The rate policies of the route, in the order they apply, at most 10.
          maxItems: 10
        requestTimeoutMs:
          type: integer
          format: int64
          description: The request timeout, in milliseconds.
          default: 30000
          minimum: 1
        retryPolicy:
          $ref: '#/components/schemas/RouteRetryPolicy'
          description: Which failed requests are retried.
        service:
          type: string
          description: |-
            The catalogue service whose keys authorize the route; it must equal the catalogue service
            of the upstream.
          example: core
          maxLength: 63
          minLength: 1
        streaming:
          type:
          - boolean
          - 'null'
          description: Whether the route streams its response; `false` when absent.
          default: false
        upstreamId:
          type: string
          format: uuid
          description: The upstream the route forwards to.
      additionalProperties: false
    CreateUpstreamRequest:
      type: object
      description: Body of the upstream-creation operation.
      required:
      - name
      - namespace
      - service
      - catalogService
      - port
      - protocol
      properties:
        catalogService:
          type: string
          description: The catalogue service whose keys authorize the routes of this upstream.
          example: core
          maxLength: 63
          minLength: 1
        concurrencyLimit:
          type: integer
          format: int64
          description: The largest number of concurrent requests to the upstream.
          default: 256
          minimum: 1
        connectTimeoutMs:
          type: integer
          format: int64
          description: The connect timeout, in milliseconds.
          default: 250
          minimum: 1
        forwardCredentials:
          type: boolean
          description: Whether the credentials of the caller are forwarded to the upstream.
          default: false
        name:
          type: string
          description: |-
            The name of the upstream: a service name such as `core`, unique among the upstreams that
            are not deleted; it cannot change afterwards.
          example: core
          maxLength: 63
          minLength: 1
        namespace:
          type: string
          description: The Kubernetes namespace of the Service.
          example: platform
          maxLength: 63
          minLength: 1
        outlierConsecutiveErrors:
          type: integer
          format: int64
          description: The number of consecutive failures after which an endpoint is ejected.
          default: 5
          minimum: 1
        port:
          type: integer
          format: int64
          description: The port of the Service.
          example: 8080
          maximum: 65535
          minimum: 1
        protocol:
          $ref: '#/components/schemas/UpstreamProtocol'
          description: The protocol the gateway speaks to the upstream.
        responseTimeoutMs:
          type: integer
          format: int64
          description: The response timeout, in milliseconds.
          default: 10000
          minimum: 1
        retryBudgetPercent:
          type: integer
          format: int64
          description: The retry budget, in percent of the requests.
          default: 10
          maximum: 100
          minimum: 0
        service:
          type: string
          description: The Kubernetes Service that the gateway proxies to.
          example: core-service
          maxLength: 63
          minLength: 1
      additionalProperties: false
    DeletedRatePolicy:
      type: object
      description: The result of a rate-policy deletion.
      required:
      - id
      - version
      properties:
        id:
          type: string
          format: uuid
          description: The identifier of the deleted rate policy.
        version:
          type: integer
          format: int64
          description: The final version of the rate policy.
          minimum: 1
    DeletedRole:
      type: object
      description: The result of a role deletion.
      required:
      - id
      - revokedAssignments
      properties:
        id:
          type: string
          format: uuid
          description: The identifier of the deleted role.
        revokedAssignments:
          type: integer
          format: int32
          description: The number of assignments that the deletion revoked.
          minimum: 0
    DependencyFailure:
      type: object
      description: One dependency that did not answer its probe.
      required:
      - dependency
      - message
      properties:
        dependency:
          type: string
          description: '`database`, `cache`, `message_broker` or `kafka`.'
        message:
          type: string
          description: Failure message of the probe.
    EffectivePermission:
      type: object
      description: One key or wildcard that a user holds.
      required:
      - key
      - kind
      - service
      - wildcard
      - roles
      - scopes
      properties:
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
          description: |-
            The shortest expiry among the contributing assignments that expire, as an RFC 3339 UTC
            time; absent when none of them expires.
          example: 2027-01-15T08:00:00.000000Z
        key:
          type: string
          description: The permission key or the wildcard pattern.
          example: rest:billing:GET /invoices
        kind:
          type: string
          description: 'The form of the key: `rest` or `gql`, or `reserved` for a reserved `iam:` key.'
          example: rest
        roles:
          type: array
          items:
            $ref: '#/components/schemas/GrantingRole'
          description: The roles of the active assignments that grant it, in identifier order.
        scopes:
          type: array
          items:
            type: string
          description: 'Where it is held: `["all"]` when a global assignment grants it, else the project ids.'
          example:
          - all
        service:
          type: string
          description: The service of the key.
          example: billing
        wildcard:
          type: boolean
          description: Whether the entry is a wildcard pattern; a wildcard never covers a sensitive key.
    ExampleApiResource:
      type: object
      description: Template example resource.
      required:
      - id
      - name
      - description
      properties:
        description:
          type: string
          description: Free-text description of the resource.
          maxLength: 1024
          minLength: 1
          pattern: ^[^\u0000]*$
        id:
          type: string
          format: uuid
          description: Identifier of the resource.
        name:
          type: string
          description: Display name of the resource.
          maxLength: 255
          minLength: 1
          pattern: ^[^\u0000]*$
    FlagDowngrade:
      type: object
      description: A coordinate that would lose a flag.
      required:
      - coordinate
      - before
      - after
      properties:
        after:
          $ref: '#/components/schemas/CoordinateFlags'
          description: Its flags in the new version.
        before:
          $ref: '#/components/schemas/CoordinateFlags'
          description: Its flags in the active versions.
        coordinate:
          type: string
          description: The coordinate, `Type.field`.
          example: Mutation.pay
    GrantingRole:
      type: object
      description: A role that grants an effective permission.
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
          description: The identifier of the role.
        name:
          type:
          - string
          - 'null'
          description: The name of the role; absent when the role is no longer stored.
          maxLength: 100
    GraphQlPermission:
      type: object
      description: A GraphQL catalogue entry.
      required:
      - id
      - key
      - service
      - type
      - field
      - flags
      - active
      - versions
      - roles
      properties:
        active:
          type: boolean
          description: Whether some active version holds the key.
        field:
          type: string
          description: The field of the key; `__introspection` for the introspection key.
          example: invoices
        flags:
          $ref: '#/components/schemas/CoordinateFlags'
          description: 'The flags of the entry: the most restrictive ones across the active versions.'
        id:
          type: string
          format: uuid
          description: The identifier of the entry.
        key:
          type: string
          description: The permission key, `gql:{service}:{Type}.{field}` or `gql:{service}:__introspection`.
          example: gql:billing:Query.invoices
        roles:
          type: array
          items:
            type: string
          description: |-
            The identifiers of the roles that grant the key by its exact key, in order. Wildcard
            grants are not listed.
        service:
          type: string
          description: The service of the key.
          example: billing
        type:
          type: string
          description: The GraphQL type of the key; `__introspection` for the introspection key.
          example: Query
        versions:
          type: array
          items:
            type: string
          description: The identifiers of the active versions that contain the key, in order.
    GraphQlPermissionPage:
      type: object
      description: One page of GraphQL catalogue entries.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GraphQlPermission'
          description: The entries of the page.
        nextCursor:
          type:
          - string
          - 'null'
          format: uuid
          description: The `after` value of the next page; absent on the last page.
    GraphQlPermissionsActivation:
      type: object
      description: The result of an activation.
      required:
      - id
      - service
      - status
      - createdKeys
      - policyVersion
      properties:
        createdKeys:
          type: array
          items:
            type: string
          description: |-
            The keys that the activation added to the catalogue, in key order; empty for a version
            that was active already.
          example:
          - gql:billing:Query.invoices
        id:
          type: string
          format: uuid
          description: The identifier of the activated version.
        policyVersion:
          type: integer
          format: int64
          description: |-
            The policy version that the activation produced; for a version that was active already,
            the current policy version.
          minimum: 0
        service:
          type: string
          description: The service the schema belongs to.
          example: billing
        status:
          type: string
          description: '`active`.'
          example: active
    GraphQlSpec:
      type: object
      description: A GraphQL specification version with its diff.
      required:
      - id
      - service
      - contentHash
      - status
      - uploadedBy
      - createdAt
      - coordinateCount
      - diff
      properties:
        activatedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: When the version became active.
        contentHash:
          type: string
          description: The SHA-256 hash of the SDL, in lower-case hexadecimal.
          maxLength: 64
          minLength: 64
        coordinateCount:
          type: integer
          format: int64
          description: The number of field coordinates of the schema.
          minimum: 0
        createdAt:
          type: string
          format: date-time
          description: When the version was loaded, as an RFC 3339 UTC time.
          example: 2026-11-23T10:15:30.123456Z
        diff:
          $ref: '#/components/schemas/GraphQlSpecDiff'
          description: What the version changes against the active versions of its service.
        id:
          type: string
          format: uuid
          description: The identifier of the version.
        retiredAt:
          type:
          - string
          - 'null'
          format: date-time
          description: When the version was retired.
        service:
          type: string
          description: The service the schema belongs to.
          example: billing
        status:
          type: string
          description: '`draft`, `active` or `retired`.'
          example: draft
        uploadedBy:
          type: string
          description: Who loaded the version, as `user:<id>`, `service:<name>` or `system:<component>`.
    GraphQlSpecDiff:
      type: object
      description: What a version changes against the union of the active versions of its service.
      required:
      - added
      - removed
      - removedGrants
      - wildcardGains
      - flagDowngrades
      properties:
        added:
          type: array
          items:
            type: string
          description: The coordinates the version adds, in order.
        flagDowngrades:
          type: array
          items:
            $ref: '#/components/schemas/FlagDowngrade'
          description: The coordinates that would lose a flag.
        removed:
          type: array
          items:
            type: string
          description: The coordinates the version removes, in order.
        removedGrants:
          type: array
          items:
            $ref: '#/components/schemas/RemovedGrant'
          description: The removed coordinates that roles grant by their exact key.
        wildcardGains:
          type: array
          items:
            $ref: '#/components/schemas/WildcardGain'
          description: The wildcard grants that would cover added coordinates.
    GraphQlSpecPage:
      type: object
      description: One page of GraphQL specification versions.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GraphQlSpecSummary'
          description: The versions of the page.
        nextCursor:
          type:
          - string
          - 'null'
          format: uuid
          description: The `after` value of the next page; absent on the last page.
    GraphQlSpecSummary:
      type: object
      description: A GraphQL specification version without its diff.
      required:
      - id
      - service
      - contentHash
      - status
      - uploadedBy
      - createdAt
      - coordinateCount
      properties:
        activatedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: When the version became active.
        contentHash:
          type: string
          description: The SHA-256 hash of the SDL, in lower-case hexadecimal.
          maxLength: 64
          minLength: 64
        coordinateCount:
          type: integer
          format: int64
          description: The number of field coordinates of the schema.
          minimum: 0
        createdAt:
          type: string
          format: date-time
          description: When the version was loaded, as an RFC 3339 UTC time.
          example: 2026-11-23T10:15:30.123456Z
        id:
          type: string
          format: uuid
          description: The identifier of the version.
        retiredAt:
          type:
          - string
          - 'null'
          format: date-time
          description: When the version was retired.
        sdl:
          type:
          - string
          - 'null'
          description: The SDL document; present only when the request asks for it with `includeSdl`.
        service:
          type: string
          description: The service the schema belongs to.
          example: billing
        status:
          type: string
          description: '`draft`, `active` or `retired`.'
          example: draft
        uploadedBy:
          type: string
          description: Who loaded the version, as `user:<id>`, `service:<name>` or `system:<component>`.
    KeyRename:
      type: object
      description: 'A coordinate that a version renames: the grants of the old key move to the new key.'
      required:
      - from
      - to
      properties:
        from:
          type: string
          description: The old key, which the version no longer holds.
          example: gql:billing:Query.bills
          maxLength: 255
          minLength: 1
        to:
          type: string
          description: The new key, which the version holds.
          example: gql:billing:Query.invoices
          maxLength: 255
          minLength: 1
      additionalProperties: false
    LoadGraphQlSpecRequest:
      type: object
      description: Body of the operation that loads a GraphQL specification.
      required:
      - service
      - sdl
      properties:
        sdl:
          type: string
          description: |-
            The SDL document, at most 5 MiB. The directives `@iamSensitive` and `@iamAuditAlways` mark
            fields that are never covered by a wildcard grant or that are always audited.
          example: 'type Query { invoices: [String!]! }'
          minLength: 1
        service:
          type: string
          description: |-
            The name of the service the schema belongs to: lower-case letters, digits and hyphens, at
            most 63 characters. The name `iam` is reserved for IAM's own schema.
          example: billing
          maxLength: 63
          minLength: 1
      additionalProperties: false
    LoadOpenApiSpecRequest:
      type: object
      description: Body of the operation that loads an `OpenAPI` specification.
      required:
      - service
      - document
      properties:
        document:
          type: string
          description: |-
            The `OpenAPI` 3.0.x or 3.1.x document as JSON text, at most 5 MiB, with at most 5,000
            operations and internal `#/` references only. The members `x-iam-sensitive: true` and
            `x-iam-audit: always` of an operation mark it as never covered by a wildcard grant or as
            always audited.
          example: '{"openapi":"3.1.0","info":{"title":"Billing","version":"1"},"paths":{}}'
          minLength: 1
        service:
          type: string
          description: |-
            The name of the service the document belongs to: lower-case letters, digits and hyphens, at
            most 63 characters. The name `iam` is reserved for IAM's own document.
          example: billing
          maxLength: 63
          minLength: 1
      additionalProperties: false
    OpenApiSpec:
      type: object
      description: An `OpenAPI` specification version with its diff.
      required:
      - id
      - service
      - contentHash
      - status
      - uploadedBy
      - createdAt
      - operationCount
      - diff
      properties:
        activatedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: When the version became active.
        contentHash:
          type: string
          description: The SHA-256 hash of the document, in lower-case hexadecimal.
          maxLength: 64
          minLength: 64
        createdAt:
          type: string
          format: date-time
          description: When the version was loaded, as an RFC 3339 UTC time.
          example: 2026-11-23T10:15:30.123456Z
        diff:
          $ref: '#/components/schemas/OpenApiSpecDiff'
          description: What the version changes against the active versions of its service.
        id:
          type: string
          format: uuid
          description: The identifier of the version.
        operationCount:
          type: integer
          format: int64
          description: The number of operations of the document.
          minimum: 0
        retiredAt:
          type:
          - string
          - 'null'
          format: date-time
          description: When the version was retired.
        service:
          type: string
          description: The service the document belongs to.
          example: billing
        status:
          type: string
          description: '`draft`, `active` or `retired`.'
          example: draft
        uploadedBy:
          type: string
          description: Who loaded the version, as `user:<id>`, `service:<name>` or `system:<component>`.
    OpenApiSpecDiff:
      type: object
      description: What a version changes against the union of the active versions of its service.
      required:
      - added
      - removed
      - removedGrants
      - wildcardGains
      - flagDowngrades
      properties:
        added:
          type: array
          items:
            type: string
          description: The operations the version adds, in order.
        flagDowngrades:
          type: array
          items:
            $ref: '#/components/schemas/OperationFlagDowngrade'
          description: The operations that would lose a flag.
        removed:
          type: array
          items:
            type: string
          description: The operations the version removes, in order.
        removedGrants:
          type: array
          items:
            $ref: '#/components/schemas/RemovedOperationGrant'
          description: The removed operations that roles grant by their exact key.
        wildcardGains:
          type: array
          items:
            $ref: '#/components/schemas/OperationWildcardGain'
          description: The wildcard grants that would cover added operations.
    OpenApiSpecPage:
      type: object
      description: One page of `OpenAPI` specification versions.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OpenApiSpecSummary'
          description: The versions of the page.
        nextCursor:
          type:
          - string
          - 'null'
          format: uuid
          description: The `after` value of the next page; absent on the last page.
    OpenApiSpecSummary:
      type: object
      description: An `OpenAPI` specification version without its diff.
      required:
      - id
      - service
      - contentHash
      - status
      - uploadedBy
      - createdAt
      - operationCount
      properties:
        activatedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: When the version became active.
        contentHash:
          type: string
          description: The SHA-256 hash of the document, in lower-case hexadecimal.
          maxLength: 64
          minLength: 64
        createdAt:
          type: string
          format: date-time
          description: When the version was loaded, as an RFC 3339 UTC time.
          example: 2026-11-23T10:15:30.123456Z
        document:
          type:
          - string
          - 'null'
          description: |-
            The `OpenAPI` document as JSON text; present only when the request asks for it with
            `includeDocument`.
        id:
          type: string
          format: uuid
          description: The identifier of the version.
        operationCount:
          type: integer
          format: int64
          description: The number of operations of the document.
          minimum: 0
        retiredAt:
          type:
          - string
          - 'null'
          format: date-time
          description: When the version was retired.
        service:
          type: string
          description: The service the document belongs to.
          example: billing
        status:
          type: string
          description: '`draft`, `active` or `retired`.'
          example: draft
        uploadedBy:
          type: string
          description: Who loaded the version, as `user:<id>`, `service:<name>` or `system:<component>`.
    OperationFlagDowngrade:
      type: object
      description: An operation that would lose a flag.
      required:
      - operation
      - before
      - after
      properties:
        after:
          $ref: '#/components/schemas/OperationFlags'
          description: Its flags in the new version.
        before:
          $ref: '#/components/schemas/OperationFlags'
          description: Its flags in the active versions.
        operation:
          type: string
          description: The operation, `{METHOD} {template}`.
          example: POST /api/invoices/{}/pay
    OperationFlags:
      type: object
      description: The two flags of an operation.
      required:
      - sensitive
      - auditAlways
      properties:
        auditAlways:
          type: boolean
          description: 'Whether every use of the operation is audited (`x-iam-audit: always`).'
        sensitive:
          type: boolean
          description: Whether a wildcard grant never covers the operation (`x-iam-sensitive`).
    OperationWildcardGain:
      type: object
      description: A wildcard grant that would cover added operations.
      required:
      - role
      - pattern
      - operations
      properties:
        operations:
          type: array
          items:
            type: string
          description: The added operations the pattern would cover, in order.
        pattern:
          type: string
          description: The wildcard pattern, such as `rest:billing:GET *`.
          example: rest:billing:GET *
        role:
          type: string
          description: The identifier of the role that holds the grant.
    Problem:
      type: object
      description: An RFC 9457 problem document.
      required:
      - type
      - title
      - status
      properties:
        detail:
          type:
          - string
          - 'null'
          description: Explanation specific to this occurrence.
        failures:
          type: array
          items:
            $ref: '#/components/schemas/DependencyFailure'
          description: Failed probes, for `/problems/dependency-unavailable`.
        status:
          type: integer
          format: int32
          description: HTTP status code.
          maximum: 599
          minimum: 100
        title:
          type: string
          description: Canonical reason phrase of the status.
        type:
          type: string
          description: '`about:blank` or a relative URI reference.'
        violations:
          type: array
          items:
            $ref: '#/components/schemas/Violation'
          description: Violated constraints, for `/problems/validation-failed`.
    RatePolicy:
      type: object
      description: A rate policy.
      required:
      - id
      - name
      - key
      - limit
      - periodMs
      - burst
      - fallback
      - version
      - createdAt
      - updatedAt
      properties:
        burst:
          type: integer
          format: int64
          description: The number of requests allowed above the limit in a burst.
          minimum: 0
        createdAt:
          type: string
          format: date-time
          description: When the rate policy was created, as an RFC 3339 UTC time.
          example: 2026-11-23T10:15:30.123456Z
        fallback:
          type: string
          description: 'What the limit becomes without the shared counter: `divided` or `full`.'
          example: divided
        id:
          type: string
          format: uuid
          description: The identifier of the rate policy.
        key:
          type: string
          description: 'What requests are counted by: `ip`, `subject`, `subject_route` or `route`.'
          example: subject_route
        limit:
          type: integer
          format: int64
          description: The number of requests allowed per period.
          minimum: 1
        name:
          type: string
          description: The name of the rate policy.
          maxLength: 100
          minLength: 1
        periodMs:
          type: integer
          format: int64
          description: The period in milliseconds.
          minimum: 1000
        updatedAt:
          type: string
          format: date-time
          description: When the rate policy was last changed, as an RFC 3339 UTC time.
          example: 2026-11-23T10:15:30.123456Z
        version:
          type: integer
          format: int64
          description: The version of the rate policy; its `ETag` is this number in double quotes.
          minimum: 1
    RatePolicyPage:
      type: object
      description: One page of rate policies.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RatePolicy'
          description: The rate policies of the page.
        nextCursor:
          type:
          - string
          - 'null'
          format: uuid
          description: The `after` value of the next page; absent on the last page.
    RemovedGrant:
      type: object
      description: A removed coordinate that roles grant by its exact key.
      required:
      - coordinate
      - roles
      properties:
        coordinate:
          type: string
          description: The removed coordinate, `Type.field`.
          example: Mutation.pay
        roles:
          type: array
          items:
            type: string
          description: The identifiers of the roles that grant it, in order.
    RemovedOperationGrant:
      type: object
      description: A removed operation that roles grant by its exact key.
      required:
      - operation
      - roles
      properties:
        operation:
          type: string
          description: The removed operation, `{METHOD} {template}`.
          example: POST /api/invoices/{}/pay
        roles:
          type: array
          items:
            type: string
          description: The identifiers of the roles that grant it, in order.
    RestPermission:
      type: object
      description: A REST catalogue entry.
      required:
      - id
      - key
      - service
      - method
      - template
      - flags
      - active
      - versions
      - roles
      properties:
        active:
          type: boolean
          description: Whether some active version holds the key.
        flags:
          $ref: '#/components/schemas/OperationFlags'
          description: 'The flags of the entry: the most restrictive ones across the active versions.'
        id:
          type: string
          format: uuid
          description: The identifier of the entry.
        key:
          type: string
          description: The permission key, `rest:{service}:{METHOD} {template}`.
          example: rest:billing:POST /api/invoices/{}/pay
        method:
          type: string
          description: The HTTP method of the key.
          example: POST
        roles:
          type: array
          items:
            type: string
          description: |-
            The identifiers of the roles that grant the key by its exact key, in order. Wildcard
            grants are not listed.
        service:
          type: string
          description: The service of the key.
          example: billing
        template:
          type: string
          description: The normalised path template of the key; parameters are written `{}`.
          example: /api/invoices/{}/pay
        versions:
          type: array
          items:
            type: string
          description: The identifiers of the active versions that contain the key, in order.
    RestPermissionPage:
      type: object
      description: One page of REST catalogue entries.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RestPermission'
          description: The entries of the page.
        nextCursor:
          type:
          - string
          - 'null'
          format: uuid
          description: The `after` value of the next page; absent on the last page.
    RestPermissionsActivation:
      type: object
      description: The result of an activation.
      required:
      - id
      - service
      - status
      - createdKeys
      - policyVersion
      properties:
        createdKeys:
          type: array
          items:
            type: string
          description: |-
            The keys that the activation added to the catalogue, in key order; empty for a version
            that was active already.
          example:
          - rest:billing:GET /invoices
        id:
          type: string
          format: uuid
          description: The identifier of the activated version.
        policyVersion:
          type: integer
          format: int64
          description: |-
            The policy version that the activation produced; for a version that was active already,
            the current policy version.
          minimum: 0
        service:
          type: string
          description: The service the document belongs to.
          example: billing
        status:
          type: string
          description: '`active`.'
          example: active
    ResyncPolicyRequest:
      type: object
      description: Body of the operation that resyncs the policy state.
      properties:
        reason:
          type: string
          description: |-
            Why the policy is resynced: one line of 1 to 500 characters, kept in the audit record and in
            `iam.policy.resynced`. A missing or blank reason is refused with 422.
          example: The state topic lost records after a broker failure.
          maxLength: 500
          minLength: 1
      additionalProperties: false
    RetireSpecRequest:
      type: object
      description: Body of the operation that retires a specification version.
      properties:
        confirmOrphans:
          type: boolean
          description: |-
            Accepts that grants of keys that leave the catalogue become inactive. Without it, a
            retirement that would orphan grants is refused with 409 and lists them.
      additionalProperties: false
    Role:
      type: object
      description: A role.
      required:
      - id
      - name
      - kind
      - grantCount
      - version
      - createdAt
      - updatedAt
      properties:
        createdAt:
          type: string
          format: date-time
          description: When the role was created, as an RFC 3339 UTC time.
          example: 2026-11-23T10:15:30.123456Z
        description:
          type:
          - string
          - 'null'
          description: What the role is for.
          maxLength: 1000
        grantCount:
          type: integer
          format: int64
          description: The number of permission grants of the role.
          minimum: 0
        id:
          type: string
          format: uuid
          description: The identifier of the role.
        kind:
          type: string
          description: '`system` for a role that IAM manages, `custom` for one that an administrator manages.'
          example: custom
        name:
          type: string
          description: The name of the role.
          maxLength: 100
          minLength: 1
        updatedAt:
          type: string
          format: date-time
          description: When the role was last changed, as an RFC 3339 UTC time.
          example: 2026-11-23T10:15:30.123456Z
        version:
          type: integer
          format: int64
          description: The version of the role; its `ETag` is this number in double quotes.
          minimum: 1
    RolePage:
      type: object
      description: One page of roles.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Role'
          description: The roles of the page.
        nextCursor:
          type:
          - string
          - 'null'
          format: uuid
          description: The `after` value of the next page; absent on the last page.
    RolePermission:
      type: object
      description: One grant of a role.
      required:
      - key
      - kind
      - service
      - active
      - wildcard
      properties:
        active:
          type: boolean
          description: |-
            Whether the grant takes part in decisions; a grant to a key that left the catalogue is
            inactive.
        key:
          type: string
          description: The permission key or the wildcard pattern.
          example: rest:billing:GET /invoices
        kind:
          type: string
          description: 'The form of the key: `rest` or `gql`, or `reserved` for a reserved `iam:` key.'
          example: rest
        service:
          type: string
          description: The service of the key.
          example: billing
        wildcard:
          type: boolean
          description: Whether the grant is a wildcard pattern.
    RolePermissions:
      type: object
      description: The grants of a role.
      required:
      - roleId
      - version
      - permissions
      properties:
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/RolePermission'
          description: The grants in key order.
        roleId:
          type: string
          format: uuid
          description: The identifier of the role.
        version:
          type: integer
          format: int64
          description: The version of the role.
          minimum: 1
    Route:
      allOf:
      - $ref: '#/components/schemas/RouteTraffic'
        description: Whether the route serves GraphQL and whether it streams its response.
      - type: object
        required:
        - id
        - host
        - methods
        - pathPattern
        - service
        - upstreamId
        - anonymous
        - enforcement
        - bodyLimitBytes
        - requestTimeoutMs
        - idleTimeoutMs
        - retryPolicy
        - ratePolicyIds
        - system
        - version
        - createdAt
        - updatedAt
        properties:
          anonymous:
            type: boolean
            description: Whether the route is served without authentication.
          bodyLimitBytes:
            type: integer
            format: int64
            description: The largest request body, in bytes.
            minimum: 1
          cors:
            oneOf:
            - $ref: '#/components/schemas/RouteCorsPolicy'
              description: The CORS policy of the route, when it has one.
            - type: 'null'
          createdAt:
            type: string
            format: date-time
            description: When the route was created, as an RFC 3339 UTC time.
            example: 2026-11-23T10:15:30.123456Z
          enforcement:
            $ref: '#/components/schemas/RouteEnforcement'
            description: The enforcement mode.
          host:
            type: string
            description: The host the route serves.
          id:
            type: string
            format: uuid
            description: The identifier of the route.
          idleTimeoutMs:
            type: integer
            format: int32
            description: The idle timeout, in milliseconds.
            minimum: 1
          methods:
            type: array
            items:
              $ref: '#/components/schemas/RouteMethod'
            description: The methods the route serves.
          pathPattern:
            type: string
            description: The path pattern.
          ratePolicyIds:
            type: array
            items:
              type: string
            description: The rate policies of the route, in the order they apply.
          requestTimeoutMs:
            type: integer
            format: int32
            description: The request timeout, in milliseconds.
            minimum: 1
          retryPolicy:
            $ref: '#/components/schemas/RouteRetryPolicy'
            description: Which failed requests are retried.
          service:
            type: string
            description: The catalogue service whose keys authorize the route.
          system:
            type: boolean
            description: Whether IAM manages the route itself; the API refuses every change of a system route.
          updatedAt:
            type: string
            format: date-time
            description: When the route was last changed, as an RFC 3339 UTC time.
            example: 2026-11-23T10:15:30.123456Z
          upstreamId:
            type: string
            format: uuid
            description: The upstream the route forwards to.
          version:
            type: integer
            format: int64
            description: The version of the route; its `ETag` is this number in double quotes.
            minimum: 1
      description: A route.
    RouteConfiguration:
      type: object
      description: The routes of a host and the version of the set.
      required:
      - host
      - version
      - routes
      properties:
        host:
          type: string
          description: The host.
        routes:
          type: array
          items:
            $ref: '#/components/schemas/RouteDeclaration'
          description: The routes of the host, in the form that the operation accepts.
        version:
          type: integer
          format: int64
          description: The version of the set; its `ETag` is this number in double quotes.
          minimum: 1
    RouteConfigurationChange:
      type: object
      description: A route that a set adds, changes or removes.
      required:
      - methods
      - pathPattern
      properties:
        changedFields:
          type: array
          items:
            type: string
          description: The names of the properties that change; present for a changed route only.
        methods:
          type: array
          items:
            $ref: '#/components/schemas/RouteMethod'
          description: The methods of the route.
        pathPattern:
          type: string
          description: The path pattern of the route.
    RouteConfigurationDiff:
      type: object
      description: The routes that a set adds, changes and removes.
      required:
      - host
      - dryRun
      - version
      - routeCount
      - revocation
      - unchanged
      - added
      - changed
      - removed
      properties:
        added:
          type: array
          items:
            $ref: '#/components/schemas/RouteConfigurationChange'
          description: The routes the set creates.
        changed:
          type: array
          items:
            $ref: '#/components/schemas/RouteConfigurationChange'
          description: The routes the set updates.
        dryRun:
          type: boolean
          description: Whether the request was a dry run, which wrote nothing.
        host:
          type: string
          description: The host.
        removed:
          type: array
          items:
            $ref: '#/components/schemas/RouteConfigurationChange'
          description: The routes the set deletes.
        revocation:
          type: boolean
          description: |-
            Whether the diff deletes a route, clears `anonymous` or moves `enforcement` from `audit`
            to `enforce`, which makes the application revocation-class.
        routeCount:
          type: integer
          format: int64
          description: The number of routes the host has, or would have after a dry run.
          minimum: 0
        unchanged:
          type: integer
          format: int64
          description: The number of declared routes that equal a stored route.
          minimum: 0
        version:
          type: integer
          format: int64
          description: |-
            The version of the set of the host: the version after an applied set, the stored version
            after a dry run or a set that changes nothing.
          minimum: 1
    RouteCorsPolicy:
      type: object
      description: 'The CORS policy of a route: exact origins, never a wildcard.'
      required:
      - origins
      properties:
        allowCredentials:
          type: boolean
          description: Whether credentials are allowed.
          default: false
        headers:
          type: array
          items:
            type: string
          description: The allowed request headers.
        maxAgeSeconds:
          type: integer
          format: int64
          description: How long a preflight answer may be cached, in seconds, at most 86,400.
          default: 600
          maximum: 86400
          minimum: 0
        methods:
          type: array
          items:
            $ref: '#/components/schemas/RouteMethod'
          description: The allowed methods.
        origins:
          type: array
          items:
            type: string
          description: |-
            The allowed origins, each an exact `https` (or `http`) origin such as
            `https://app.example.com`.
          minItems: 1
      additionalProperties: false
    RouteDeclaration:
      type: object
      description: One route of a declared set.
      required:
      - methods
      - pathPattern
      - service
      - upstreamId
      properties:
        anonymous:
          type:
          - boolean
          - 'null'
          description: |-
            Whether the route is served without authentication; needs `iam:route:anonymous`; `false`
            when absent.
          default: false
        bodyLimitBytes:
          type: integer
          format: int64
          description: The largest request body, in bytes.
          default: 1048576
          minimum: 1
        cors:
          oneOf:
          - $ref: '#/components/schemas/RouteCorsPolicy'
            description: The CORS policy of the route, when it has one.
          - type: 'null'
        enforcement:
          $ref: '#/components/schemas/RouteEnforcement'
          description: The enforcement mode; `audit` needs `iam:route:anonymous`.
        graphql:
          type:
          - boolean
          - 'null'
          description: Whether the route serves GraphQL; `false` when absent.
          default: false
        idleTimeoutMs:
          type: integer
          format: int64
          description: The idle timeout, in milliseconds.
          default: 60000
          minimum: 1
        methods:
          type: array
          items:
            $ref: '#/components/schemas/RouteMethod'
          description: The methods the route serves.
          minItems: 1
        pathPattern:
          type: string
          description: The path pattern, with `{name}` and `{name:*}` segments.
          example: /api/orders/{id}
          maxLength: 2048
          minLength: 1
        ratePolicyIds:
          type: array
          items:
            type: string
          description: The rate policies of the route, in the order they apply, at most 10.
          maxItems: 10
        requestTimeoutMs:
          type: integer
          format: int64
          description: The request timeout, in milliseconds.
          default: 30000
          minimum: 1
        retryPolicy:
          $ref: '#/components/schemas/RouteRetryPolicy'
          description: Which failed requests are retried.
        service:
          type: string
          description: |-
            The catalogue service whose keys authorize the route; it must equal the catalogue service
            of the upstream.
          example: core
          maxLength: 63
          minLength: 1
        streaming:
          type:
          - boolean
          - 'null'
          description: Whether the route streams its response; `false` when absent.
          default: false
        upstreamId:
          type: string
          format: uuid
          description: The upstream the route forwards to.
      additionalProperties: false
    RouteEnforcement:
      type: string
      description: What the gateway does with a request that the decision denies.
      enum:
      - enforce
      - audit
    RouteMethod:
      type: string
      description: An HTTP method that a route serves.
      enum:
      - GET
      - HEAD
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    RoutePage:
      type: object
      description: One page of routes.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Route'
          description: The routes of the page.
        nextCursor:
          type:
          - string
          - 'null'
          format: uuid
          description: The `after` value of the next page; absent on the last page.
    RouteRetryPolicy:
      type: string
      description: Which failed requests the gateway retries.
      enum:
      - none
      - idempotent
    RouteTraffic:
      type: object
      description: How the gateway carries the traffic of a route.
      required:
      - graphql
      - streaming
      properties:
        graphql:
          type: boolean
          description: Whether the route serves GraphQL.
        streaming:
          type: boolean
          description: Whether the route streams its response.
    SetRolePermissionsRequest:
      type: object
      description: Body of the operation that replaces the grants of a role.
      required:
      - keys
      properties:
        keys:
          type: array
          items:
            type: string
          description: |-
            The new grant set: keys of an active catalogue and the four wildcard forms of a service
            that has a catalogue (`gql:{service}:{Type}.*`, `gql:{service}:*`,
            `rest:{service}:{METHOD} *`, `rest:{service}:*`). A key that repeats counts once; an empty
            list removes every grant.
          example:
          - rest:billing:GET /invoices
          - gql:billing:*
          maxItems: 5000
      additionalProperties: false
    SpecRetirement:
      type: object
      description: The result of a retirement.
      required:
      - id
      - service
      - status
      - policyVersion
      properties:
        id:
          type: string
          format: uuid
          description: The identifier of the retired version.
        policyVersion:
          type: integer
          format: int64
          description: The policy version that the retirement produced.
          minimum: 0
        service:
          type: string
          description: The service the specification belongs to.
          example: billing
        status:
          type: string
          description: '`retired`.'
          example: retired
    TokenResolution:
      type: object
      description: |-
        The answer of the token-resolution operation.

        A resolved credential carries the subject, the session, the roles claim and the expiry; a
        refused one carries the reason code. The credential itself is never echoed.
      required:
      - resolved
      properties:
        expiresAt:
          type:
          - integer
          - 'null'
          format: int64
          description: When the token expires, in seconds since 1970-01-01T00:00:00Z.
          minimum: 0
        reason:
          type:
          - string
          - 'null'
          description: |-
            Why the credential is refused: `token_missing`, `token_invalid`, `token_expired` or
            `token_revoked`.
          example: token_expired
        resolved:
          type: boolean
          description: Whether the credential is valid and unrevoked.
        roles:
          type:
          - array
          - 'null'
          items:
            type: string
          description: The roles claim of the token as issued.
        sessionId:
          type:
          - string
          - 'null'
          description: The User service session of the token, when it names one.
        subjectId:
          type:
          - string
          - 'null'
          description: The user id, or the service name of a service principal.
        subjectKind:
          type:
          - string
          - 'null'
          description: '`user` or `service`.'
          example: user
    TokenResolutionRequest:
      type: object
      description: |-
        Body of the token-resolution operation.

        Its `Debug` output never shows the credential.
      required:
      - credential
      properties:
        credential:
          type: string
          description: The User service token to resolve; an empty one resolves as `token_missing`.
          example: eyJhbGciOiJSUzI1NiJ9.e30.c2lnbmF0dXJl
          maxLength: 8192
      additionalProperties: false
    UpdateRatePolicyRequest:
      type: object
      description: |-
        Body of the rate-policy update operation: every member is optional, and an absent one stays as
        it is.
      properties:
        burst:
          type:
          - integer
          - 'null'
          format: int64
          description: The new burst, from 0 to 4,294,967,295.
          example: 20
          minimum: 0
        fallback:
          type:
          - string
          - 'null'
          description: 'The new fallback: `divided` or `full`.'
          example: divided
        key:
          type:
          - string
          - 'null'
          description: 'The new key kind: `ip`, `subject`, `subject_route` or `route`.'
          example: subject_route
        limit:
          type:
          - integer
          - 'null'
          format: int64
          description: The new limit, from 1 to 4,294,967,295.
          example: 100
          minimum: 1
        name:
          type:
          - string
          - 'null'
          description: |-
            The new name: 1 to 100 characters without a control character, unique among the rate
            policies that are not deleted.
          example: per-subject-route
          maxLength: 100
          minLength: 1
        periodMs:
          type:
          - integer
          - 'null'
          format: int64
          description: 'The new period in milliseconds: a multiple of 1,000, from 1,000 to 4,294,967,295,000.'
          example: 60000
          minimum: 1000
      additionalProperties: false
    UpdateRoleRequest:
      type: object
      description: 'Body of the role-update operation: every member is optional, and an absent one stays as it is.'
      properties:
        description:
          type:
          - string
          - 'null'
          description: The new description; `null` removes it and an absent member keeps it.
          example: Manages invoices and refunds.
          maxLength: 1000
        name:
          type:
          - string
          - 'null'
          description: |-
            The new name of the role: unique without regard to case among the roles that are not
            deleted, without control characters.
          example: Billing administrator
          maxLength: 100
          minLength: 1
      additionalProperties: false
    UpdateRouteRequest:
      type: object
      description: |-
        Body of the route-update operation: every member is optional, and an absent one stays as it
        is.
      properties:
        anonymous:
          type:
          - boolean
          - 'null'
          description: |-
            Whether the route is served without authentication; changing it needs
            `iam:route:anonymous`.
        bodyLimitBytes:
          type:
          - integer
          - 'null'
          format: int64
          description: The largest request body, in bytes.
          minimum: 1
        cors:
          oneOf:
          - $ref: '#/components/schemas/RouteCorsPolicy'
            description: The CORS policy of the route; `null` removes it.
          - type: 'null'
        enforcement:
          oneOf:
          - $ref: '#/components/schemas/RouteEnforcement'
            description: The enforcement mode; changing it needs `iam:route:anonymous`.
          - type: 'null'
        graphql:
          type:
          - boolean
          - 'null'
          description: Whether the route serves GraphQL.
        host:
          type:
          - string
          - 'null'
          description: The lower-case DNS name of the host the route serves.
          example: app.example.test
          maxLength: 253
          minLength: 1
        idleTimeoutMs:
          type:
          - integer
          - 'null'
          format: int64
          description: The idle timeout, in milliseconds.
          minimum: 1
        methods:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/RouteMethod'
          description: The methods the route serves.
          minItems: 1
        pathPattern:
          type:
          - string
          - 'null'
          description: The path pattern, with `{name}` and `{name:*}` segments.
          example: /api/orders/{id}
          maxLength: 2048
          minLength: 1
        ratePolicyIds:
          type:
          - array
          - 'null'
          items:
            type: string
          description: The rate policies of the route, in the order they apply, at most 10.
          maxItems: 10
        requestTimeoutMs:
          type:
          - integer
          - 'null'
          format: int64
          description: The request timeout, in milliseconds.
          minimum: 1
        retryPolicy:
          oneOf:
          - $ref: '#/components/schemas/RouteRetryPolicy'
            description: Which failed requests are retried.
          - type: 'null'
        service:
          type:
          - string
          - 'null'
          description: The catalogue service whose keys authorize the route.
          example: core
          maxLength: 63
          minLength: 1
        streaming:
          type:
          - boolean
          - 'null'
          description: Whether the route streams its response.
        upstreamId:
          type:
          - string
          - 'null'
          format: uuid
          description: The upstream the route forwards to.
      additionalProperties: false
    UpdateUpstreamRequest:
      type: object
      description: |-
        Body of the upstream-update operation: every member is optional, and an absent one stays as
        it is. The name cannot change: a name other than the stored one is a violation.
      properties:
        catalogService:
          type:
          - string
          - 'null'
          description: The catalogue service whose keys authorize the routes of this upstream.
          example: core
          maxLength: 63
          minLength: 1
        concurrencyLimit:
          type:
          - integer
          - 'null'
          format: int64
          description: The largest number of concurrent requests to the upstream.
          minimum: 1
        connectTimeoutMs:
          type:
          - integer
          - 'null'
          format: int64
          description: The connect timeout, in milliseconds.
          minimum: 1
        forwardCredentials:
          type:
          - boolean
          - 'null'
          description: Whether the credentials of the caller are forwarded to the upstream.
        name:
          type:
          - string
          - 'null'
          description: The name of the upstream; it must equal the stored name.
          example: core
          maxLength: 63
          minLength: 1
        namespace:
          type:
          - string
          - 'null'
          description: The Kubernetes namespace of the Service.
          example: platform
          maxLength: 63
          minLength: 1
        outlierConsecutiveErrors:
          type:
          - integer
          - 'null'
          format: int64
          description: The number of consecutive failures after which an endpoint is ejected.
          minimum: 1
        port:
          type:
          - integer
          - 'null'
          format: int64
          description: The port of the Service.
          example: 8080
          maximum: 65535
          minimum: 1
        protocol:
          oneOf:
          - $ref: '#/components/schemas/UpstreamProtocol'
            description: The protocol the gateway speaks to the upstream.
          - type: 'null'
        responseTimeoutMs:
          type:
          - integer
          - 'null'
          format: int64
          description: The response timeout, in milliseconds.
          minimum: 1
        retryBudgetPercent:
          type:
          - integer
          - 'null'
          format: int64
          description: The retry budget, in percent of the requests.
          maximum: 100
          minimum: 0
        service:
          type:
          - string
          - 'null'
          description: The Kubernetes Service that the gateway proxies to.
          example: core-service
          maxLength: 63
          minLength: 1
      additionalProperties: false
    UpdateUserRoleRequest:
      type: object
      description: Body of the assignment-update operation.
      required:
      - expiresAt
      properties:
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
          description: |-
            The new expiry, as an RFC 3339 UTC time in the future; `null` clears the expiry. The member
            is required, so that an empty body never clears an expiry by accident.
          example: 2027-01-15T08:00:00Z
      additionalProperties: false
    Upstream:
      type: object
      description: An upstream.
      required:
      - id
      - name
      - namespace
      - service
      - catalogService
      - forwardCredentials
      - port
      - protocol
      - connectTimeoutMs
      - responseTimeoutMs
      - concurrencyLimit
      - retryBudgetPercent
      - outlierConsecutiveErrors
      - system
      - version
      - createdAt
      - updatedAt
      properties:
        catalogService:
          type: string
          description: The catalogue service whose keys authorize the routes of this upstream.
        concurrencyLimit:
          type: integer
          format: int32
          description: The largest number of concurrent requests to the upstream.
          minimum: 1
        connectTimeoutMs:
          type: integer
          format: int32
          description: The connect timeout, in milliseconds.
          minimum: 1
        createdAt:
          type: string
          format: date-time
          description: When the upstream was created, as an RFC 3339 UTC time.
          example: 2026-11-23T10:15:30.123456Z
        forwardCredentials:
          type: boolean
          description: Whether the credentials of the caller are forwarded to the upstream.
        id:
          type: string
          format: uuid
          description: The identifier of the upstream.
        name:
          type: string
          description: The name of the upstream.
          maxLength: 63
          minLength: 1
        namespace:
          type: string
          description: The Kubernetes namespace of the Service.
        outlierConsecutiveErrors:
          type: integer
          format: int32
          description: The number of consecutive failures after which an endpoint is ejected.
          minimum: 1
        port:
          type: integer
          format: int32
          description: The port of the Service.
          maximum: 65535
          minimum: 1
        protocol:
          $ref: '#/components/schemas/UpstreamProtocol'
          description: The protocol the gateway speaks to the upstream.
        responseTimeoutMs:
          type: integer
          format: int32
          description: The response timeout, in milliseconds.
          minimum: 1
        retryBudgetPercent:
          type: integer
          format: int32
          description: The retry budget, in percent of the requests.
          maximum: 100
          minimum: 0
        service:
          type: string
          description: The Kubernetes Service that the gateway proxies to.
        system:
          type: boolean
          description: Whether IAM manages the upstream itself; the API refuses every change of a system upstream.
        updatedAt:
          type: string
          format: date-time
          description: When the upstream was last changed, as an RFC 3339 UTC time.
          example: 2026-11-23T10:15:30.123456Z
        version:
          type: integer
          format: int64
          description: The version of the upstream; its `ETag` is this number in double quotes.
          minimum: 1
    UpstreamPage:
      type: object
      description: One page of upstreams.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Upstream'
          description: The upstreams of the page.
        nextCursor:
          type:
          - string
          - 'null'
          format: uuid
          description: The `after` value of the next page; absent on the last page.
    UpstreamProtocol:
      type: string
      description: The protocol the gateway speaks to an upstream.
      enum:
      - http1
      - h2c
    UserRole:
      type: object
      description: A role assignment.
      required:
      - id
      - subject
      - roleId
      - scope
      - version
      - createdAt
      - updatedAt
      properties:
        createdAt:
          type: string
          format: date-time
          description: When the assignment was created, as an RFC 3339 UTC time.
          example: 2026-11-23T10:15:30.123456Z
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
          description: When the assignment expires, as an RFC 3339 UTC time; absent when it never expires.
          example: 2027-01-15T08:00:00.000000Z
        id:
          type: string
          format: uuid
          description: The identifier of the assignment.
        roleId:
          type: string
          format: uuid
          description: The assigned role.
        roleName:
          type:
          - string
          - 'null'
          description: The name of the assigned role.
          maxLength: 100
        scope:
          $ref: '#/components/schemas/AssignmentScope'
          description: Where the role applies.
        subject:
          $ref: '#/components/schemas/AssignmentSubject'
          description: Who holds the role.
        updatedAt:
          type: string
          format: date-time
          description: When the assignment was last changed, as an RFC 3339 UTC time.
          example: 2026-11-23T10:15:30.123456Z
        version:
          type: integer
          format: int64
          description: The version of the assignment; its `ETag` is this number in double quotes.
          minimum: 1
    UserRolePage:
      type: object
      description: One page of role assignments.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserRole'
          description: The assignments of the page.
        nextCursor:
          type:
          - string
          - 'null'
          format: uuid
          description: The `after` value of the next page; absent on the last page.
    UserRolePermissions:
      type: object
      description: The effective permissions of a user.
      required:
      - userId
      - policyVersion
      - permissions
      properties:
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/EffectivePermission'
          description: The exact keys in key order, then the wildcard patterns.
        policyVersion:
          type: integer
          format: int64
          description: The policy version the permissions were composed at.
          minimum: 0
        userId:
          type: string
          format: uuid
          description: The user whose permissions these are.
    ValidateAccessBatchRequest:
      type: object
      description: |-
        Body of the batch access-validation operation: 1 to 100 checks of the single-check shape.

        Its `Debug` output never shows a credential.
      required:
      - checks
      properties:
        checks:
          type: array
          items:
            $ref: '#/components/schemas/ValidateAccessRequest'
          description: |-
            The checks to decide, 1 to 100; each one has the shape of the single check, and the
            results come back in this order. A check that breaks a rule of its own is decided as a
            `deny` with the reason `malformed_operation` and does not fail the others.
          maxItems: 100
          minItems: 1
      additionalProperties: false
    ValidateAccessRequest:
      type: object
      description: |-
        Body of the access-validation operation: who asks, about which service, and what is checked.

        Its `Debug` output never shows the credential.
      required:
      - credential
      - service
      - requestId
      properties:
        credential:
          type: string
          description: |-
            The subject's access token as the caller received it; an empty one is decided as
            `token_missing`.
          example: eyJhbGciOiJSUzI1NiJ9.e30.c2lnbmF0dXJl
          maxLength: 8192
        graphql:
          oneOf:
          - $ref: '#/components/schemas/AccessValidationGraphQlTarget'
            description: |-
              A GraphQL document to check; exactly one of `rest`, `graphql` and `permissions` is given.
              The decision is all-or-nothing: the document is allowed only when the subject holds the key
              of every coordinate it selects, and `denied` lists every coordinate it does not hold.
          - type: 'null'
        minPolicyVersion:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            The policy version that the decision must reflect at least; a version that IAM has not
            issued yet is refused with 422.
          minimum: 0
        permissions:
          type:
          - array
          - 'null'
          items:
            type: string
          description: |-
            The permission keys to check, 1 to 100; exactly one of `rest`, `graphql` and
            `permissions` is given.
          maxItems: 100
          minItems: 1
        projectId:
          type:
          - string
          - 'null'
          format: uuid
          description: |-
            The project in which the check is made; without it, project assignments contribute their
            projects to `scopes`.
        requestId:
          type: string
          description: |-
            An opaque identifier of the caller's request, 1 to 128 visible ASCII characters; the
            response echoes it.
          example: req-0190f2a8
          maxLength: 128
          minLength: 1
        rest:
          oneOf:
          - $ref: '#/components/schemas/AccessValidationRestTarget'
            description: A REST request to check; exactly one of `rest`, `graphql` and `permissions` is given.
          - type: 'null'
        service:
          type: string
          description: The target service, as registered in IAM.
          example: billing
          maxLength: 63
          minLength: 1
      additionalProperties: false
    Violation:
      type: object
      description: One violated constraint.
      required:
      - propertyPath
      - message
      - code
      properties:
        code:
          type: string
          description: Stable code of the violated constraint.
        message:
          type: string
          description: Human-readable explanation.
        propertyPath:
          type: string
          description: Wire name of the invalid field.
    WildcardGain:
      type: object
      description: A wildcard grant that would cover added coordinates.
      required:
      - role
      - pattern
      - coordinates
      properties:
        coordinates:
          type: array
          items:
            type: string
          description: The added coordinates the pattern would cover, in order.
        pattern:
          type: string
          description: The wildcard pattern, such as `gql:billing:Query.*`.
          example: gql:billing:Query.*
        role:
          type: string
          description: The identifier of the role that holds the grant.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A User service access token.
tags:
- name: ExampleApiResource
  description: Template example resource endpoints.
- name: HealthCheck
  description: Runtime health-check endpoints.
- name: iam
  description: 'IAM endpoints: authentication and authorization of API callers.'

              description: The `Bearer` challenge.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Version not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The version is retired, another change got there first, the activation would remove a flag (`/problems/flag-downgrade-confirmation-required`) or orphan grants (`/problems/orphan-confirmation-required`) without confirmation.
          content:
            application/problem+json:

        schema:
          type: integer
          format: int32
          default: 30
          maximum: 100
          minimum: 1
      - name: after
        in: query
        description: The `nextCursor` of the previous page; absent for the first page.
        required: false
        schema:
          type: string
          format: uuid
      - name: service
        in: query
        description: Only entries of this service.
        required: false
        schema:
          type: string
          maxLength: 63
        example: billing
      - name: method
        in: query
        description: Only entries of this HTTP method, in upper case.
        required: false
        schema:
          type: string
        example: GET
      - name: active
        in: query
        description: Only active (`true`) or only inactive (`false`) entries.
        required: false
        schema:
          type: boolean
      - name: sensitive
        in: query
        description: Only entries that are sensitive (`true`) or not (`false`).
        required: false
        schema:
          type: boolean
      - name: templatePrefix
        in: query
        description: |-
          Only entries whose normalised path template starts with this text; parameters are written
          `{}`.
        required: false
        schema:
          type: string
          maxLength: 2048
        example: /api/invoices
      responses:
        '200':
          description: One page of entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestPermissionPage'

openapi: 3.1.0
info:
  title: VilnaCRM API Gateway API
  description: This API provides endpoints to manage VilnaCRM API Gateway data within VilnaCRM.
  contact:
    name: VilnaCRM Support
    url: https://github.com/VilnaCRM-Org/api-gateway-service
    email: support@vilnacrm.com
  license:
    name: CC0-1.0
    url: https://creativecommons.org/publicdomain/zero/1.0/
  version: 1.0.0
servers:
- url: /
  description: Current host
paths:
  /api/access-validations:
    post:
      tags:
      - iam
      summary: Validates whether a subject may perform an operation or hold permission keys.
      description: 'Decides one check for the bearer of `credential` on the target `service`: a REST request (`rest`), a GraphQL document (`graphql`) or a list of permission keys (`permissions`), exactly one of them. A GraphQL document is allowed only when the subject holds every coordinate it selects; `denied` lists every coordinate it does not hold, and a document over a limit is a deny with `limits_exceeded`. A valid request always returns 200 with a decision body: `allow`, or `deny` with the `reason` and the `denied` keys or coordinates. A `minPolicyVersion` above the current policy version is refused with 422. The credential is never echoed.'
      operationId: api_access_validations_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateAccessRequest'
        required: true
      responses:
        '200':
          description: The decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessValidation'
        '400':
          description: Invalid input.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The caller presented no valid bearer token.
          headers:
            www-authenticate:
              schema:
                type: string
              description: The `Bearer` challenge.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller may not validate access.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: Request body too large.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Unsupported media type.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearerAuth: []
  /api/access-validations/batch:
    post:
      tags:
      - iam
      summary: Validates a batch of access checks.
      description: 'Decides 1 to 100 checks of the shape of `POST /access-validations` and returns one result per check, in the order of the request, each with its own `decisionId`. The checks are decided independently: a check that cannot be read produces a `deny` result with the reason `malformed_operation` and does not fail the others, and each distinct credential is resolved once per batch. A batch of no check or of more than 100 is refused with 422. The credentials are never echoed.'
      operationId: api_access_validations_batch_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateAccessBatchRequest'
        required: true
      responses:
        '200':
          description: The decisions, in request order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessValidationBatch'
        '400':
          description: Invalid input.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The caller presented no valid bearer token.
          headers:
            www-authenticate:
              schema:
                type: string
              description: The `Bearer` challenge.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller may not validate access.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: Request body too large.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Unsupported media type.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearerAuth: []
  /api/bulk-operations:
    get:
      tags:
      - iam
      summary: Retrieves the collection of bulk operations.
      description: Returns one page of bulk operations, oldest first, with the `nextCursor` of the next page.
      operationId: api_bulk_operations_get
      parameters:
      - name: limit
        in: query
        description: The largest number of operations of the page.
        required: false
        schema:
          type: integer
          format: int32
          default: 30
          maximum: 100
          minimum: 1
      - name: after
        in: query
        description: The `nextCursor` of the previous page; absent for the first page.
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: One page of bulk operations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationPage'
        '400':
          description: Invalid query parameter.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The caller presented no valid bearer token.
          headers:
            www-authenticate:
              schema:
                type: string
              description: The `Bearer` challenge.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller does not hold the key of the operation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearerAuth: []
  /api/bulk-operations/{id}:
    get:
      tags:
      - iam
      summary: Retrieves a bulk operation.
      description: 'Returns the bulk operation with the identifier: its kind, status, applied and total records, the policy versions of its first and last chunk, its requester and, for a failed operation, its error. `propagation` is `null` until the chunks of a revocation-class operation are fenced by the pods'' acknowledgements.'
      operationId: api_bulk_operations_id_get
      parameters:
      - name: id
        in: path
        description: Bulk operation identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The bulk operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperation'
        '400':
          description: Invalid identifier.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The caller presented no valid bearer token.
          headers:
            www-authenticate:
              schema:
                type: string
              description: The `Bearer` challenge.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller does not hold the key of the operation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Bulk operation not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearerAuth: []
  /api/example_api_resources:
    get:
      tags:
      - ExampleApiResource
      summary: Retrieves the collection of ExampleApiResource resources.
      description: Returns one page of resources, newest first.
      operationId: api_example_api_resources_get
      parameters:
      - name: page
        in: query
        description: Page number, starting at 1.
        required: false
        schema:
          type: integer
          format: int32
          default: 1
          minimum: 1
      - name: itemsPerPage
        in: query
        description: Number of items per page.
        required: false
        schema:
          type: integer
          format: int32
          default: 30
          maximum: 100
          minimum: 1
      responses:
        '200':
          description: ExampleApiResource collection
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExampleApiResource'
        '400':
          description: Invalid query parameter.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      tags:
      - ExampleApiResource
      summary: Creates an ExampleApiResource resource.
      description: Validates the input, stores the resource and returns it.
      operationId: api_example_api_resources_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExampleApiResourceRequest'
        required: true
      responses:
        '201':
          description: ExampleApiResource resource created
          headers:
            location:
              schema:
                type: string
              description: Path of the created resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExampleApiResource'
        '400':
          description: Invalid input.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: Request body too large.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Unsupported media type.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/example_api_resources/{id}:
    get:
      tags:
      - ExampleApiResource
      summary: Retrieves an ExampleApiResource resource.
      description: Returns the resource identified by id.
      operationId: api_example_api_resources_id_get
      parameters:
      - name: id
        in: path
        description: ExampleApiResource identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ExampleApiResource resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExampleApiResource'
        '400':
          description: Invalid identifier.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Resource not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/graphql-permissions:
    get:
      tags:
      - iam
      summary: Retrieves the collection of GraphQL permissions.
      description: 'Returns one page of the catalogue in a stable order, with the `nextCursor` of the next page. Filters: `service`, `type`, `active`, `sensitive` and `keyPrefix`. Each entry carries its key, service, type, field, flags, active state, the active versions that contain it and the roles that grant it by its exact key.'
      operationId: api_graphql_permissions_get
      parameters:
      - name: limit
        in: query
        description: The largest number of entries of the page.
        required: false
        schema:
          type: integer
          format: int32
          default: 30
          maximum: 100
          minimum: 1
      - name: after
        in: query
        description: The `nextCursor` of the previous page; absent for the first page.
        required: false
        schema:
          type: string
          format: uuid
      - name: service
        in: query
        description: Only entries of this service.
        required: false
        schema:
          type: string
          maxLength: 63
        example: billing
      - name: type
        in: query
        description: Only entries of this GraphQL type.
        required: false
        schema:
          type: string
          maxLength: 255
        example: Query
      - name: active
        in: query
        description: Only active (`true`) or only inactive (`false`) entries.
        required: false
        schema:
          type: boolean
      - name: sensitive
        in: query
        description: Only entries that are sensitive (`true`) or not (`false`).
        required: false
        schema:
          type: boolean
      - name: keyPrefix
        in: query
        description: Only entries whose key starts with this text.
        required: false
        schema:
          type: string
          maxLength: 512
        example: gql:billing:Query.
      responses:
        '200':
          description: One page of entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphQlPermissionPage'
        '400':
          description: Invalid query parameter.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The caller presented no valid bearer token.
          headers:
            www-authenticate:
              schema:
                type: string
              description: The `Bearer` challenge.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearerAuth: []
  /api/graphql-permissions/{id}:
    get:
      tags:
      - iam
      summary: Retrieves a GraphQL permission.
      description: 'Returns the entry with the identifier: its key, service, type, field, flags, active state, the active versions that contain it and the roles that grant it by its exact key.'
      operationId: api_graphql_permissions_id_get
      parameters:
      - name: id
        in: path
        description: Permission identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphQlPermission'
        '400':
          description: Invalid identifier.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The caller presented no valid bearer token.
          headers:
            www-authenticate:
              schema:
                type: string
              description: The `Bearer` challenge.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Permission not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearerAuth: []
  /api/graphql-specs:
    get:
      tags:
      - iam
      summary: Retrieves the collection of GraphQL specifications.
      description: 'Returns one page of versions in a stable order, with the `nextCursor` of the next page. Filters: `service` and `status`. Each version carries its service, hash, status, uploader, timestamps and coordinate count; the SDL only when `includeSdl` is `true`.'
      operationId: api_graphql_specs_get
      parameters:
      - name: limit
        in: query
        description: The largest number of versions of the page.
        required: false
        schema:
          type: integer
          format: int32
          default: 30
          maximum: 100
          minimum: 1
      - name: after
        in: query
        description: The `nextCursor` of the previous page; absent for the first page.
        required: false
        schema:
          type: string
          format: uuid
      - name: service
        in: query
        description: Only versions of this service.
        required: false
        schema:
          type: string
          maxLength: 63
        example: billing
      - name: status
        in: query
        description: 'Only versions in this status: `draft`, `active` or `retired`.'
        required: false
        schema:
          type: string
        example: active
      - name: includeSdl
        in: query
        description: Whether each version carries its SDL; default `false`.
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: One page of versions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphQlSpecPage'
        '400':
          description: Invalid query parameter.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The caller presented no valid bearer token.
          headers:
            www-authenticate:
              schema:
                type: string
              description: The `Bearer` challenge.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearerAuth: []
    post:
      tags:
      - iam
      summary: Loads a GraphQL specification.
      description: Stores the SDL of a service as a draft version and records `iam.graphql_spec.loaded`. The response lists what the version adds and removes against the active versions of the service. An SDL that an earlier version of the service already holds returns that version with 200 and changes nothing. The service `iam` is reserved for IAM's own schema.
      operationId: api_graphql_specs_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoadGraphQlSpecRequest'
        required: true
      responses:
        '200':
          description: The service already holds this SDL; its version is returned.
          headers:
            location:
              schema:
                type: string
              description: Path of the version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphQlSpec'
        '201':
          description: The draft version was created.
          headers:
            location:
              schema:
                type: string
              description: Path of the version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphQlSpec'
        '400':
          description: Invalid input.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The caller presented no valid bearer token.
          headers:
            www-authenticate:
              schema:
                type: string
              description: The `Bearer` challenge.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The service `iam` is reserved for IAM's own schema.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The same SDL was uploaded concurrently.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: Request body too large.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Unsupported media type.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 'Validation failed: an invalid service name or an SDL that does not parse.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearerAuth: []
  /api/graphql-specs/{id}:
    get:
      tags:
      - iam
      summary: Retrieves a GraphQL specification.
      description: 'Returns the version with the identifier: its service, hash, status, uploader, timestamps and coordinate count, and its SDL only when `includeSdl` is `true`.'
      operationId: api_graphql_specs_id_get
      parameters:
      - name: id
        in: path
        description: Version identifier
        required: true
        schema:
          type: string
          format: uuid
      - name: includeSdl
        in: query
        description: Whether the version carries its SDL; default `false`.
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: The version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphQlSpecSummary'
        '400':
          description: Invalid identifier or query parameter.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The caller presented no valid bearer token.
          headers:
            www-authenticate:
              schema:
                type: string
              description: The `Bearer` challenge.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Version not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearerAuth: []
  /api/graphql-specs/{id}/diff:
    get:
      tags:
      - iam
      summary: Retrieves the diff of a GraphQL specification.
      description: Returns the coordinates the version adds and removes against the union of the active versions of its service, the removed coordinates that roles grant, the wildcard grants that would cover added coordinates and the coordinates that would lose a flag such as `@iamSensitive`.
      operationId: api_graphql_specs_id_diff_get
      parameters:
      - name: id
        in: path
        description: Version identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The diff of the version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphQlSpecDiff'
        '400':
          description: Invalid identifier.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The caller presented no valid bearer token.
          headers:
            www-authenticate:
              schema:
                type: string
              description: The `Bearer` challenge.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Version not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearerAuth: []
  /api/graphql-specs/{id}/permissions:
    post:
      tags:
      - iam
      summary: Activates a GraphQL specification.
      description: 'Makes the draft version active and its fields grantable permissions: the catalogue of the service becomes the union of its active versions, the next policy version is taken and `iam.graphql_permissions.created` is recorded with `createdKeys`, `renamed` and `flagChanges`. An activation that would remove the sensitive or always-audit flag from a key is refused with 409 unless `confirmFlagDowngrade` is `true`, and one that would orphan grants is refused with 409 unless `confirmOrphans` is `true`; the problem lists the keys or the grants. `renames` moves the grants of old keys to new keys before anything is orphaned. A version that is active already returns 200 and changes nothing. A repeated `Idempotency-Key` with the same body within 24 hours returns the original result.'
      operationId: api_graphql_specs_id_permissions_post
      parameters:
      - name: id
        in: path
        description: Version identifier
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        description: Makes the activation safe to repeat for 24 hours; 1 to 255 visible ASCII characters.
        required: false
        schema:
          type:
          - string
          - 'null'
      requestBody:
        content:

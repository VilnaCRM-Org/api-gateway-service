openapi: 3.1.0
info:
  title: VilnaCRM API Gateway API
  description: This API provides endpoints to manage VilnaCRM API Gateway data within VilnaCRM.
  contact:
    name: VilnaCRM Support
    url: https://github.com/VilnaCRM-Org/api-gateway-service
    email: support@vilnacrm.com
  license:
    name: CC0-1.0
    url: https://creativecommons.org/publicdomain/zero/1.0/
  version: 1.0.0
servers:
- url: /
  description: Current host
paths:
  /api/example_api_resources:
    get:
      tags:
      - ExampleApiResource
      summary: Retrieves the collection of ExampleApiResource resources.
      description: Returns one page of resources, newest first.
      operationId: api_example_api_resources_get
      parameters:
      - name: page
        in: query
        description: Page number, starting at 1.
        required: false
        schema:
          type: integer
          format: int32
          default: 1
          minimum: 1
      - name: itemsPerPage
        in: query
        description: Number of items per page.
        required: false
        schema:
          type: integer
          format: int32
          default: 30
          maximum: 100
          minimum: 1
      responses:
        '200':
          description: ExampleApiResource collection
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExampleApiResource'
        '400':
          description: Invalid query parameter.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      tags:
      - ExampleApiResource
      summary: Creates an ExampleApiResource resource.
      description: Validates the input, stores the resource and returns it.
      operationId: api_example_api_resources_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExampleApiResourceRequest'
        required: true
      responses:
        '201':
          description: ExampleApiResource resource created
          headers:
            location:
              schema:
                type: string
              description: Path of the created resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExampleApiResource'
        '400':
          description: Invalid input.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: Request body too large.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Unsupported media type.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/example_api_resources/{id}:
    get:
      tags:
      - ExampleApiResource
      summary: Retrieves an ExampleApiResource resource.
      description: Returns the resource identified by id.
      operationId: api_example_api_resources_id_get
      parameters:
      - name: id
        in: path
        description: ExampleApiResource identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ExampleApiResource resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExampleApiResource'
        '400':
          description: Invalid identifier.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Resource not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/health:
    get:
      tags:
      - HealthCheck
      summary: Checks the health of the service.
      description: Returns 204 when the database, the cache and the message broker respond. Returns a 500 problem document that lists every failing dependency otherwise.
      operationId: api_health_get
      responses:
        '204':
          description: Health check passed with no content to return.
        '500':
          description: Health check failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/roles:
    get:
      tags:
      - iam
      summary: Retrieves the collection of roles.
      description: 'Returns one page of roles in a stable order, with the `nextCursor` of the next page. Filters: `namePrefix` (without regard to case) and `kind`.'
      operationId: api_roles_get
      parameters:
      - name: limit
        in: query
        description: The largest number of roles of the page.
        required: false
        schema:
          type: integer
          format: int32
          default: 30
          maximum: 100
          minimum: 1
      - name: after
        in: query
        description: The `nextCursor` of the previous page; absent for the first page.
        required: false
        schema:
          type: string
          format: uuid
      - name: namePrefix
        in: query
        description: Only roles whose name starts with this text, compared without regard to case.
        required: false
        schema:
          type: string
          maxLength: 100
      - name: kind
        in: query
        description: 'Only roles of this kind: `system` or `custom`.'
        required: false
        schema:
          type: string
        example: custom
      responses:
        '200':
          description: One page of roles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePage'
        '400':
          description: Invalid query parameter.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The caller presented no valid bearer token.
          headers:
            www-authenticate:
              schema:
                type: string
              description: The `Bearer` challenge.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearerAuth: []
    post:
      tags:
      - iam
      summary: Creates a role.
      description: Creates a custom role without grants at version 1 and records `iam.role.created`. A repeated `Idempotency-Key` with the same body within 24 hours returns the original result.
      operationId: api_roles_post
      parameters:
      - name: Idempotency-Key
        in: header
        description: Makes the creation safe to repeat for 24 hours; 1 to 255 visible ASCII characters.
        required: false
        schema:
          type:
          - string
          - 'null'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
        required: true
      responses:
        '201':
          description: The role was created.
          headers:
            etag:
              schema:
                type: string
              description: The version of the role in double quotes.
            location:
              schema:
                type: string
              description: Path of the created role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          description: Invalid input.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The caller presented no valid bearer token.
          headers:
            www-authenticate:
              schema:
                type: string
              description: The `Bearer` challenge.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: A role with this name exists.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: Request body too large.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Unsupported media type.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation failed, or the idempotency key was used for another request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearerAuth: []
  /api/roles/{id}:
    get:
      tags:
      - iam
      summary: Retrieves a role.
      description: Returns the role with the identifier, with its `ETag`.
      operationId: api_roles_id_get
      parameters:
      - name: id
        in: path
        description: Role identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The role.
          headers:
            etag:
              schema:
                type: string
              description: The version of the role in double quotes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          description: Invalid identifier.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The caller presented no valid bearer token.
          headers:
            www-authenticate:
              schema:
                type: string
              description: The `Bearer` challenge.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Role not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearerAuth: []
  /api/token-resolutions:
    post:
      tags:
      - iam
      summary: Resolves a User service token into its subject.
      description: Returns the subject, session, roles claim and expiry of a valid, unrevoked token, or `resolved = false` with the token reason code. The credential is never echoed.
      operationId: api_token_resolutions_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenResolutionRequest'
        required: true
      responses:
        '200':
          description: The resolution of the credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResolution'
        '400':
          description: Invalid input.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The caller presented no valid bearer token.
          headers:
            www-authenticate:
              schema:
                type: string
              description: The `Bearer` challenge.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller may not resolve tokens.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: Request body too large.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Unsupported media type.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearerAuth: []
components:
  schemas:
    CreateExampleApiResourceRequest:
      type: object
      description: Body of the create operation.
      required:
      - name
      - description
      properties:
        description:
          type: string
          description: Free-text description of the resource.
          example: Example description
          maxLength: 1024
          minLength: 1
          pattern: ^[^\u0000]*$
        name:
          type: string
          description: Display name of the resource.
          example: Example name
          maxLength: 255
          minLength: 1
          pattern: ^[^\u0000]*$
      additionalProperties: false
    CreateRoleRequest:
      type: object
      description: Body of the role-creation operation.
      required:
      - name
      properties:
        description:
          type:
          - string
          - 'null'
          description: What the role is for.
          example: Manages invoices and refunds.
          maxLength: 1000
        name:
          type: string
          description: |-
            The name of the role: unique without regard to case among the roles that are not deleted,
            without control characters.
          example: Billing administrator
          maxLength: 100
          minLength: 1
      additionalProperties: false
    DependencyFailure:
      type: object
      description: One dependency that did not answer its probe.
      required:
      - dependency
      - message
      properties:
        dependency:
          type: string
          description: '`database`, `cache` or `message_broker`.'
        message:
          type: string
          description: Failure message of the probe.
    ExampleApiResource:
      type: object
      description: Template example resource.
      required:
      - id
      - name
      - description
      properties:
        description:
          type: string
          description: Free-text description of the resource.
          maxLength: 1024
          minLength: 1
          pattern: ^[^\u0000]*$
        id:
          type: string
          format: uuid
          description: Identifier of the resource.
        name:
          type: string
          description: Display name of the resource.
          maxLength: 255
          minLength: 1
          pattern: ^[^\u0000]*$
    Problem:
      type: object
      description: An RFC 9457 problem document.
      required:
      - type
      - title
      - status
      properties:
        detail:
          type:
          - string
          - 'null'
          description: Explanation specific to this occurrence.
        failures:
          type: array
          items:
            $ref: '#/components/schemas/DependencyFailure'
          description: Failed probes, for `/problems/dependency-unavailable`.
        status:
          type: integer
          format: int32
          description: HTTP status code.
          maximum: 599
          minimum: 100
        title:
          type: string
          description: Canonical reason phrase of the status.
        type:
          type: string
          description: '`about:blank` or a relative URI reference.'
        violations:
          type: array
          items:
            $ref: '#/components/schemas/Violation'
          description: Violated constraints, for `/problems/validation-failed`.
    Role:
      type: object
      description: A role.
      required:
      - id
      - name
      - kind
      - grantCount
      - version
      - createdAt
      - updatedAt
      properties:
        createdAt:
          type: string
          format: date-time
          description: When the role was created, as an RFC 3339 UTC time.
          example: 2026-11-23T10:15:30.123456Z
        description:
          type:
          - string
          - 'null'
          description: What the role is for.
          maxLength: 1000
        grantCount:
          type: integer
          format: int64
          description: The number of permission grants of the role.
          minimum: 0
        id:
          type: string
          format: uuid
          description: The identifier of the role.
        kind:
          type: string
          description: '`system` for a role that IAM manages, `custom` for one that an administrator manages.'
          example: custom
        name:
          type: string
          description: The name of the role.
          maxLength: 100
          minLength: 1
        updatedAt:
          type: string
          format: date-time
          description: When the role was last changed, as an RFC 3339 UTC time.
          example: 2026-11-23T10:15:30.123456Z
        version:
          type: integer
          format: int64
          description: The version of the role; its `ETag` is this number in double quotes.
          minimum: 1
    RolePage:
      type: object
      description: One page of roles.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Role'
          description: The roles of the page.
        nextCursor:
          type:
          - string
          - 'null'
          format: uuid
          description: The `after` value of the next page; absent on the last page.
    TokenResolution:
      type: object
      description: |-
        The answer of the token-resolution operation.

        A resolved credential carries the subject, the session, the roles claim and the expiry; a
        refused one carries the reason code. The credential itself is never echoed.
      required:
      - resolved
      properties:
        expiresAt:
          type:
          - integer
          - 'null'
          format: int64
          description: When the token expires, in seconds since 1970-01-01T00:00:00Z.
          minimum: 0
        reason:
          type:
          - string
          - 'null'
          description: |-
            Why the credential is refused: `token_missing`, `token_invalid`, `token_expired` or
            `token_revoked`.
          example: token_expired
        resolved:
          type: boolean
          description: Whether the credential is valid and unrevoked.
        roles:
          type:
          - array
          - 'null'
          items:
            type: string
          description: The roles claim of the token as issued.
        sessionId:
          type:
          - string
          - 'null'
          description: The User service session of the token, when it names one.
        subjectId:
          type:
          - string
          - 'null'
          description: The user id, or the service name of a service principal.
        subjectKind:
          type:
          - string
          - 'null'
          description: '`user` or `service`.'
          example: user
    TokenResolutionRequest:
      type: object
      description: |-
        Body of the token-resolution operation.

        Its `Debug` output never shows the credential.
      required:
      - credential
      properties:
        credential:
          type: string
          description: The User service token to resolve; an empty one resolves as `token_missing`.
          example: eyJhbGciOiJSUzI1NiJ9.e30.c2lnbmF0dXJl
          maxLength: 8192
      additionalProperties: false
    Violation:
      type: object
      description: One violated constraint.
      required:
      - propertyPath
      - message
      - code
      properties:
        code:
          type: string
          description: Stable code of the violated constraint.
        message:
          type: string
          description: Human-readable explanation.
        propertyPath:
          type: string
          description: Wire name of the invalid field.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A User service access token.
tags:
- name: ExampleApiResource
  description: Template example resource endpoints.
- name: HealthCheck
  description: Runtime health-check endpoints.
- name: iam
  description: 'IAM endpoints: authentication and authorization of API callers.'

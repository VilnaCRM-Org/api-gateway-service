  /api/openapi-specs/{id}/permissions:
    post:
      tags:
      - iam
      summary: Activates an OpenAPI specification.
      description: 'Makes the draft version active and its operations grantable permissions: the catalogue of the service becomes the union of its active versions, the next policy version is taken and `iam.rest_permissions.created` is recorded with `createdKeys`, `renamed` and `flagChanges`. An activation that would remove the sensitive or always-audit flag from a key is refused with 409 unless `confirmFlagDowngrade` is `true`, and one that would orphan grants is refused with 409 unless `confirmOrphans` is `true`; the problem lists the keys or the grants. `renames` moves the grants of old keys to new keys before anything is orphaned. A version that is active already returns 200 and changes nothing. A repeated `Idempotency-Key` with the same body within 24 hours returns the original result.'
      operationId: api_openapi_specs_id_permissions_post
      parameters:
      - name: id
        in: path
        description: Version identifier
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        description: Makes the activation safe to repeat for 24 hours; 1 to 255 visible ASCII characters.
        required: false
        schema:
          type:
          - string
          - 'null'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRestPermissionsRequest'
        required: true
      responses:
        '200':
          description: The version was active already; nothing changed.
          headers:
            iam-policy-version:
              schema:
                type: string
              description: The current policy version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestPermissionsActivation'
        '201':
          description: The version was activated.
          headers:
            iam-policy-version:
              schema:
                type: string
              description: The policy version that the change produced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestPermissionsActivation'
        '400':
          description: Invalid input.

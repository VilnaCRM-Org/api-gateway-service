x-build: &build
  context: .
  target: prod
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']

services:
  app:
    <<: *hardening
    image: ${APP_IMAGE:-service:prod}
    build: *build
    depends_on:
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
      kafka-topics:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:-prod}
      APP_PORT: '8081'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${DB_USER:-app}:${DB_PASSWORD:-local-dev-only}@database:5432/${DB_NAME:-app}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      # Literal emulator placeholders: credentials of the host shell never reach a local container.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL_SQS: http://localstack:4566
      JWT_PUBLIC_KEYS_FILE: /etc/service/jwt-public-keys.pem
      # The compose broker at its in-network PLAINTEXT listener with the relaxed gates of a single node: both are
      # refused outside APP_ENV dev and test, and docker-compose.prod.yml replaces them.
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_SECURITY_PROTOCOL: PLAINTEXT
      KAFKA_CONFIG_GATES: relaxed
    volumes:
      # The development public key unless the caller names its own key file; the private half is never committed.
      - ${JWT_PUBLIC_KEYS_HOST_FILE:-./config/jwt/dev-public-keys.pem}:/etc/service/jwt-public-keys.pem:ro
    ports:
      - '${APP_PORT:-8081}:8081'
    healthcheck:
      test: ['CMD', '/app/service', 'healthcheck'] # exec form: the image has no shell
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s
    restart: unless-stopped
    stop_grace_period: 15s

  # The data plane: `service gateway` from the same image as `app` (ADR 0015). It needs no database, so it waits for
  # no other service. Started with `docker compose --profile gateway up iam-gateway`; the development stack does not
  # start it. Plain HTTP because APP_ENV is dev; docker-compose.prod.yml adds the certificate pair of production.
  iam-gateway:
    <<: *hardening
    image: ${APP_IMAGE:-service:prod}
    build: *build
    command: ['gateway']
    profiles: [gateway]
    environment:
      APP_ENV: dev
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GATEWAY_LISTEN: 0.0.0.0:8443
      GATEWAY_INTERNAL_LISTEN: 0.0.0.0:9090
      GATEWAY_PROBE_LISTEN: 0.0.0.0:9092
      POD_NAME: iam-gateway
      POD_NAMESPACE: ${POD_NAMESPACE:-local}
      TOKIO_WORKER_THREADS: ${TOKIO_WORKER_THREADS:-2}
      JWT_PUBLIC_KEYS_FILE: /etc/service/jwt-public-keys.pem
      UPSTREAM_DISCOVERY: static
      UPSTREAM_STATIC_ENDPOINTS_FILE: /etc/service/upstream-endpoints.json
    volumes:
      - ${JWT_PUBLIC_KEYS_HOST_FILE:-./config/jwt/dev-public-keys.pem}:/etc/service/jwt-public-keys.pem:ro
      - ${UPSTREAM_ENDPOINTS_HOST_FILE:-./config/upstream/dev-static-endpoints.json}:/etc/service/upstream-endpoints.json:ro
    ports:
      - '127.0.0.1:${GATEWAY_PORT:-8443}:8443'
    healthcheck:
      test: ['CMD', '/app/service', 'healthcheck', '--mode', 'gateway'] # exec form: the image has no shell
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s
    restart: unless-stopped
    stop_grace_period: 15s

  migrate:
    <<: *hardening
    image: ${APP_IMAGE:-service:prod}
    build: *build
    command: ['migrate']
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${DB_USER:-app}:${DB_PASSWORD:-local-dev-only}@database:5432/${DB_NAME:-app}
    restart: 'no'

  database:
    # The one image without a digest: its tag is DB_VERSION, and a digest would override the tag.
    image: postgres:${DB_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-app}
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-dev-only}
      # From PostgreSQL 18 the image keeps the cluster in /var/lib/postgresql/<major>/docker and refuses a
      # mount at /var/lib/postgresql/data. Naming the old path keeps the data in db_data for every DB_VERSION.
      # A change of the major version still needs a fresh volume or pg_upgrade.
      PGDATA: /var/lib/postgresql/data
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
      start_interval: 1s
    restart: unless-stopped

  localstack:
    image: localstack/localstack:3.4.0@sha256:54fcf172f6ff70909e1e26652c3bb4587282890aff0d02c20aa7695469476ac0
    environment:
      SERVICES: sqs
      DEBUG: '0'
    ports:
      - '127.0.0.1:${LOCALSTACK_PORT:-4566}:4566'
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      # Also warms SQS.
      test: ['CMD-SHELL', 'awslocal sqs list-queues > /dev/null']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  kafka:
    # Development and test only: the single-node KRaft broker of the krafka spikes (Stories 1.2 to 1.5, removed in
    # Story 1.7), kept for the Kafka adapter tests of Epic 7. No production code uses it. PLAINTEXT as a super
    # user: `localhost:${KAFKA_PORT}` from the host, `kafka:19092` inside the compose network.
    image: apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
    environment:
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      # SCRAM_HOST and SCRAM_DOCKER (Story 1.5): SASL SCRAM-SHA-512 over TLS with the certificate that the
      # one-shot service `kafka-tls` generates under target/kafka-tls/ before the broker starts (no key is
      # committed); `localhost:${KAFKA_SASL_SSL_PORT}` from the host, `kafka:19094` inside the network.
      KAFKA_LISTENERS: PLAINTEXT://:9092,DOCKER://:19092,CONTROLLER://:9093,SCRAM_HOST://:9094,SCRAM_DOCKER://:19094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT:-9092},DOCKER://kafka:19092,SCRAM_HOST://localhost:${KAFKA_SASL_SSL_PORT:-9094},SCRAM_DOCKER://kafka:19094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT,SCRAM_HOST:SASL_SSL,SCRAM_DOCKER:SASL_SSL
      KAFKA_SASL_ENABLED_MECHANISMS: SCRAM-SHA-512
      KAFKA_LISTENER_NAME_SCRAM__HOST_SCRAM___SHA___512_SASL_JAAS_CONFIG: org.apache.kafka.common.security.scram.ScramLoginModule required;
      KAFKA_LISTENER_NAME_SCRAM__DOCKER_SCRAM___SHA___512_SASL_JAAS_CONFIG: org.apache.kafka.common.security.scram.ScramLoginModule required;
      KAFKA_SSL_KEYSTORE_TYPE: PEM
      KAFKA_SSL_KEYSTORE_LOCATION: /workspace/target/kafka-tls/broker-keystore.pem
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
      KAFKA_NUM_PARTITIONS: '1'
      # Story 1.3: the KRaft ACL authorizer (the successor of the `simple` authorizer) without the implicit allow,
      # so that the spike reads `allow.everyone.if.no.acl.found` and lists ACLs. The anonymous PLAINTEXT
      # principal (tests and inter-broker traffic) is a super user; `super.users` is a `;`-separated list, and
      # any other principal needs an ACL or an entry there.
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: 'false'
      KAFKA_SUPER_USERS: User:ANONYMOUS
    depends_on:
      kafka-tls:
        condition: service_completed_successfully
    volumes:
      # Read-only: the broker reads its PEM keystore from target/kafka-tls/ of the checkout.
      - ./:/workspace:ro
    ports:
      - '127.0.0.1:${KAFKA_PORT:-9092}:9092'
      - '127.0.0.1:${KAFKA_SASL_SSL_PORT:-9094}:9094'
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null']
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s
      start_interval: 2s
    restart: unless-stopped

  kafka-topics:
    # Development and test only (Story 7.3): creates the state topic and the events topic with the settings the
    # Kafka configuration gates require, replication factor 1 because the broker is a single node
    # (scripts/kafka-topics-fixture.sh). The service waits for it, so `/api/health` finds the topics.
    image: apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
    entrypoint:
      - /bin/sh
      - /repo/scripts/kafka-topics-fixture.sh
      - kafka:19092
      - ${POLICY_TOPIC:-iam.policy.state.v1}
      - ${EVENTS_TOPIC:-iam.events.v1}
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./:/repo:ro
    restart: 'no'

  kafka-tls:
    # Development and test only (Story 1.5): generates the CA, the broker certificate and the untrusted CA of
    # the SCRAM listeners into target/kafka-tls/ as the host user, so that the test process reads the CA file
    # from the checkout. It keeps a set that is still valid and regenerates it otherwise.
    image: apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
    user: '${HOST_UID:-1000}:${HOST_GID:-1000}'
    entrypoint: ['/bin/sh', '/repo/scripts/kafka-tls-fixture.sh', '/repo/target/kafka-tls']
    volumes:
      - ./:/repo
    restart: 'no'

  # The 3-broker profile `kafka-cluster` (Story 1.3), development only and outside `make ci`: three combined
  # KRaft nodes for the leader-change observation of the krafka spike (restored from history to run it, since
  # Story 1.7 removed it), reachable only inside the compose network at `kafka-cluster-<n>:19092`. Started and
  # stopped by hand as `docs/spikes/phase-0.md` describes; no make target and no other service starts it.
  kafka-cluster-1: &kafka-cluster
    profiles: [kafka-cluster]
    image: apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
    environment: &kafka-cluster-environment
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: DOCKER://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: DOCKER://kafka-cluster-1:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-cluster-1:9093,2@kafka-cluster-2:9093,3@kafka-cluster-3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '3'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '3'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '2'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: 'false'
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null']
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s
      start_interval: 2s
    restart: 'no'

  kafka-cluster-2:
    <<: *kafka-cluster
    environment:
      <<: *kafka-cluster-environment
      KAFKA_NODE_ID: '2'
      KAFKA_ADVERTISED_LISTENERS: DOCKER://kafka-cluster-2:19092

  kafka-cluster-3:
    <<: *kafka-cluster
    environment:
      <<: *kafka-cluster-environment
      KAFKA_NODE_ID: '3'
      KAFKA_ADVERTISED_LISTENERS: DOCKER://kafka-cluster-3:19092

volumes:
  db_data:
  localstack_data:
